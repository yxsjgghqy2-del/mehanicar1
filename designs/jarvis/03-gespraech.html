<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F6F4">
<title>Jarvis · Gespräch mit Werkzeugen</title>
<style>
:root{
 --paper:#F6F6F4;--card:#FFFFFF;--tint:#FAFAF8;--sunk:#EEEEEA;--line:#E0E0DA;--line2:#ECECE7;
 --ink:#1F2428;--ink2:#565C63;--ink3:#7E838A;
 --slate:#2C3E50;--slate-mute:#AFBCC9;--slate-bg:#E6EAEE;
 --olive:#5B6B3A;--olive-d:#4B5930;--olive-bg:#EBEEE2;--olive-ink:#44512A;--olive-lt:#B5C293;
 --rust:#9A4930;--rust-bg:#F5E7E1;
 --ochre:#7A5C15;--ochre-bg:#F2EBD8;
 --aug:#A3A298;
 --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
 --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 --gut:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tn{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}

/* Rahmen */
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);max-width:1180px;margin:0 auto;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + var(--gut)) 8px calc(env(safe-area-inset-left) + var(--gut));border-bottom:1px solid var(--line)}
.idn{display:flex;align-items:center;gap:10px;min-width:0}
.mono{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font:600 19px/1 var(--serif);color:var(--slate);flex:none}
.idt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.idt b{font-size:16px;letter-spacing:-.01em}
.idt span{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.sub-d{display:none}
.top-r{display:flex;align-items:center;gap:20px}
.date{display:none;font-size:13px;color:var(--ink2)}
.back{font-size:12.5px;color:var(--ink3);text-decoration:none;padding:12px 0;white-space:nowrap}
.back:hover{color:var(--ink)}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 18px;align-items:center;gap:6px;width:100%;min-height:52px;background:var(--slate);color:#fff;padding:8px calc(env(safe-area-inset-right) + var(--gut)) 8px calc(env(safe-area-inset-left) + var(--gut))}
.strip .c{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.strip b{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip small{font-size:11px;color:var(--slate-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{transition:transform .2s ease}
.strip[aria-expanded=true] .chev{transform:rotate(180deg)}
.strip:focus-visible{outline-color:#fff;outline-offset:-4px}

.main{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.chat{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.log{position:relative;overflow-y:auto;overscroll-behavior:contain;padding:6px calc(env(safe-area-inset-right) + var(--gut)) 24px calc(env(safe-area-inset-left) + var(--gut));display:flex;flex-direction:column;gap:16px}

/* Nachrichten */
.day{align-self:center;font-size:12px;color:var(--ink3);padding-top:10px;letter-spacing:.02em}
.g{display:flex;flex-direction:column;align-items:flex-start;gap:8px;animation:up .22s ease both}
.g.me{align-items:flex-end}
.g.static{animation:none}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3)}
.who .mono{width:24px;height:24px;border-radius:7px;font-size:14px}
.who b{color:var(--ink);font-weight:600}
.b{max-width:min(92%,580px);background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 13px;overflow-wrap:anywhere}
.me .b{background:var(--slate);border-color:var(--slate);color:#fff;border-radius:16px 16px 4px 16px;max-width:min(82%,480px)}
.stamp{font-size:11.5px;color:var(--ink3);margin-top:-4px}
.dots{display:flex;gap:5px;padding:15px 14px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:bl 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* Werkzeug-Karten */
.w{width:100%;max-width:600px;background:var(--card);border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden;--st:transparent}
.w::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--st);transition:background .25s ease;z-index:1}
.st-rust{--st:var(--rust)}.st-ochre{--st:var(--ochre)}.st-olive{--st:var(--olive)}.st-slate{--st:var(--slate)}
.w.is-done{--st:var(--olive)}
.wh{display:flex;align-items:center;gap:8px;min-height:40px;padding:8px 12px 8px 15px;border-bottom:1px solid var(--line2);background:var(--tint);font-size:13px;font-weight:600;color:var(--ink2)}
.wt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb{padding:12px 14px 14px 15px;display:flex;flex-direction:column;gap:11px}
.aft{display:none!important}
.is-done .aft{display:inline-flex!important}.is-done .bef{display:none!important}

.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:650;white-space:nowrap;background:var(--sunk);color:var(--ink2);flex:none}
.c-rust{background:var(--rust-bg);color:var(--rust)}.c-ochre{background:var(--ochre-bg);color:var(--ochre)}
.c-olive{background:var(--olive-bg);color:var(--olive-ink)}.c-slate{background:var(--slate-bg);color:var(--slate)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:10px;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;transition:background .15s ease,border-color .15s ease;white-space:nowrap}
.btn:hover{background:var(--tint);border-color:#CDCDC5}
.btn.pri{background:var(--olive);border-color:var(--olive);color:#fff}
.btn.pri:hover{background:var(--olive-d);border-color:var(--olive-d)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2);padding:0 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.doneln{display:flex;align-items:center;gap:9px;min-height:44px;color:var(--olive-ink);font-weight:600;font-size:14.5px}
.doneln .ic{width:22px;height:22px;border-radius:50%;background:var(--olive-bg);padding:3px}
.laterln{display:flex;align-items:center;gap:8px;min-height:44px;color:var(--ink2);font-size:14px;flex-wrap:wrap}
.flash{animation:fl 1.2s ease}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--olive-bg),0 0 0 4px var(--olive)}100%{box-shadow:0 0 0 0 transparent}}

.pl{font:600 12px/1 var(--mono);letter-spacing:.02em;border:1px solid #9DA1A6;border-left:4px solid var(--slate);border-radius:4px;padding:4px 6px 4px 5px;background:#fff;color:var(--ink);white-space:nowrap;flex:none}
.vh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vh b{font-size:15.5px}
.vh .chip{margin-left:auto}
.sub{font-size:13px;color:var(--ink2);margin-top:-4px}
.note{margin:0;font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:flex-start}
.note .ic{margin-top:2px}

/* Zeitleiste im Konflikt */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:44px 14px minmax(0,1fr);align-items:center;column-gap:8px;min-height:36px;position:relative;font-size:14px}
.tl li::before{content:"";position:absolute;left:58px;top:0;bottom:0;width:1px;background:var(--line)}
.tl li:first-child::before{top:50%}.tl li:last-child::before{bottom:50%}
.tl time{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.tl .dot{width:10px;height:10px;border-radius:50%;justify-self:center;background:var(--ink3);position:relative;z-index:1;box-shadow:0 0 0 3px var(--card)}
.tl .t{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-plan .dot{background:var(--rust)}
.tl-new .dot{background:var(--card);border:2px solid var(--olive)}
.tl-new .t{font-weight:600}
.tl-end .dot{background:var(--slate)}
.is-done .tl-plan time,.is-done .tl-plan .t{color:var(--ink3);text-decoration:line-through}
.is-done .tl-plan .dot{background:var(--line)}
.is-done .tl-plan .chip{display:none}
.is-done .tl-new .dot{background:var(--olive)}

/* Entwürfe */
.in{margin:0;padding:8px 12px;border-left:2px solid var(--line);background:var(--tint);border-radius:0 8px 8px 0}
.in figcaption{font-size:12px;color:var(--ink3);margin-bottom:2px}
.in p{margin:0;font-size:14px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-weight:550}
.lbl{font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:-6px}
.draft{width:100%;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FCFCFA;font-size:15px;line-height:1.45;min-height:88px;overflow:hidden;transition:border-color .15s ease,box-shadow .15s ease}
.draft:focus{border-color:var(--olive);outline:none;box-shadow:0 0 0 3px var(--olive-bg)}
.draft[readonly]{background:var(--tint);color:var(--ink2)}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--ink)}
.opt .box{width:20px;height:20px;border:1.5px solid var(--ink3);border-radius:5px;display:grid;place-items:center;flex:none;transition:background .15s ease}
.opt[aria-pressed=true] .box{background:var(--olive);border-color:var(--olive);color:#fff}
.opt[aria-pressed=false] .box svg{visibility:hidden}
.is-done .opt{pointer-events:none;color:var(--ink2)}
.stars{display:flex;gap:2px;color:var(--ochre)}

/* Listen in Karten */
.qrow{display:grid;grid-template-columns:74px minmax(0,1fr) auto 16px;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 12px 8px 15px;border-top:1px solid var(--line2);transition:background .15s ease}
.qrow:first-child{border-top:0}
.qrow:hover{background:var(--tint)}
.qrow .chip{justify-self:start}
.qt{font-size:14.5px;line-height:1.35}
.u{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);white-space:nowrap}
.u::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.u-jetzt::before{background:var(--rust)}.u-heute::before{background:var(--ochre)}.u-Woche::before{background:#C4C4BC}
.u-ok::before{background:var(--olive)}
.qic{color:var(--ink3)}
.qrow.done .qt{color:var(--ink3);text-decoration:line-through}
.qrow.done .qic{color:var(--olive)}

.wtog{display:flex;align-items:center;gap:9px;width:100%;min-height:48px;padding:0 12px 0 15px;font-size:14px;font-weight:600;color:var(--ink2)}
.wtog .chip{margin-right:auto}
.wtog[aria-expanded=true] .chev{transform:rotate(180deg)}
.plog{list-style:none;margin:0;padding:2px 14px 12px 15px;border-top:1px solid var(--line2)}
.plog li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;padding:8px 0;font-size:14px;border-top:1px solid var(--line2)}
.plog li:first-child{border-top:0}
.plog time{color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}

.ord{position:relative;border-top:1px solid var(--line2)}
.ord:first-child{border-top:0}
.ord::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st)}
.ordh{display:flex;flex-direction:column;gap:6px;width:100%;padding:11px 14px 11px 15px}
.ordh:hover{background:var(--tint)}
.r1{display:flex;align-items:center;gap:8px;min-width:0}
.r1 b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r1 .chip{margin-left:auto}
.r2{font-size:13px;color:var(--ink2)}
.r3{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--st);border-radius:2px}
.pc{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.ordd{padding:0 14px 12px 15px;display:flex;flex-direction:column;gap:10px}

.op,.blk{position:relative;padding:12px 14px 14px 15px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:9px}
.op:first-of-type,.blk:first-of-type{border-top:0}
.op::before,.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st)}
.op.is-done::before,.blk.is-done::before{background:var(--olive)}
.opr{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.opr small{display:block;font-size:12px;color:var(--ink3)}
.opr>b{font-size:16px}
.age{display:flex;align-items:center;gap:10px}
.agebar{flex:1;display:flex;gap:2px;height:5px}
.agebar i{height:100%;border-radius:2px;background:#C9C9C1}
.agebar i.od{background:var(--rust)}
.agebar i.rest{background:var(--sunk)}
.is-done .agebar i.od{background:#D9B7AA}
.lnk{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:600;color:var(--slate);align-self:flex-start;margin:-8px 0}
.letter{margin:0;padding:10px 12px;background:var(--tint);border:1px solid var(--line2);border-radius:8px;font:13.5px/1.5 var(--serif);color:var(--ink2)}

/* Umsatz */
.hero{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.hero b{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero span{font-size:13px;color:var(--ink2)}
.lgd{display:flex;gap:16px;font-size:12.5px;color:var(--ink2)}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.plot{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;margin-top:6px}
.ya{position:relative;height:136px;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ya span{position:absolute;right:0;transform:translateY(50%)}
.pa{position:relative;height:136px;display:flex;border-bottom:1px solid #B5B5AD}
.gl{position:absolute;left:0;right:0;height:1px;background:var(--line2)}
.wk{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-radius:6px 6px 0 0;z-index:1;transition:background .15s ease}
.wk[aria-pressed=true]{background:rgba(44,62,80,.055)}
.wk .ba{width:min(18px,30%);border-radius:4px 4px 0 0;background:var(--aug);position:relative}
.wk .bs{background:var(--olive)}
.wk[aria-pressed=true] .bs::after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;font-size:11px;font-weight:650;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.xa{display:flex;margin-left:46px;font-size:11.5px;color:var(--ink3);margin-top:-4px}
.xa span{flex:1;text-align:center}
.readout{margin:0;font-size:13.5px;color:var(--ink2);min-height:20px}
.readout b{color:var(--ink)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.kp>div{background:var(--card);padding:9px 11px;display:flex;flex-direction:column}
.kp small{font-size:12px;color:var(--ink3)}
.kp b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.kp span{font-size:12px;color:var(--ink2)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:296px}
.tbl th{font-size:12px;font-weight:600;color:var(--ink3);text-align:left;padding:0 6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl td:first-child,.tbl th:first-child{padding-left:0}
.tbl td:last-child,.tbl th:last-child{padding-right:0}
.tbl td small{display:block;font-size:12px;color:var(--ink3)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{border-bottom:0;font-weight:650;padding-bottom:2px}
.tbl tfoot .sub2 td{font-weight:400;color:var(--ink2);font-size:13px;padding-top:0}
.meter{display:flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap;padding-top:3px}
.meter i{width:34px;height:4px;border-radius:2px;background:var(--rust-bg);position:relative;overflow:hidden}
.meter i span{position:absolute;inset:0 auto 0 0;background:var(--rust);border-radius:2px}

.day-r{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;padding:9px 14px 9px 15px;border-top:1px solid var(--line2);position:relative;font-size:14px}
.day-r:first-child{border-top:0}
.day-r::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st)}
.day-r .d b{display:block;font-size:14px}.day-r .d small{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.cap{display:flex;align-items:center;gap:8px;margin-top:4px}
.cap .bar{height:5px}
.inb{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;padding:11px 14px 11px 15px;border-top:1px solid var(--line2);min-height:44px}
.inb:first-child{border-top:0}
.inb:hover{background:var(--tint)}
.inb .ic{margin-top:2px;color:var(--ink2)}
.inb small{display:block;font-size:12px;color:var(--ink3)}
.inb p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}

.sgs{display:flex;flex-wrap:wrap;gap:8px}
.sg{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:14px;white-space:nowrap;transition:border-color .15s ease,background .15s ease}
.sg:hover{border-color:#C6C6BE}
.sg.nx{border-color:var(--olive);color:var(--olive-ink);font-weight:600}

/* Eingabe */
.comp{border-top:1px solid var(--line);background:var(--paper);padding:10px calc(env(safe-area-inset-right) + var(--gut)) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + var(--gut));display:flex;flex-direction:column;gap:8px;min-width:0}
.sugs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gut));padding:0 var(--gut)}
.sugs::-webkit-scrollbar{display:none}
.inrow{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px 3px 3px 14px;transition:border-color .15s ease}
.inrow:focus-within{border-color:var(--slate)}
#inp{flex:1;min-width:0;border:0;background:none;height:44px;font-size:16px;outline:none}
#inp::placeholder{color:var(--ink3)}
.send{width:44px;height:44px;border-radius:11px;background:var(--olive);color:#fff;display:grid;place-items:center;flex:none;transition:background .15s ease}
.send:hover{background:var(--olive-d)}

/* Kontextspalte */
.ctx{display:none;position:absolute;left:0;right:0;top:0;max-height:100%;overflow-y:auto;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 18px 40px rgba(31,36,40,.16);padding:6px calc(env(safe-area-inset-right) + var(--gut)) 16px calc(env(safe-area-inset-left) + var(--gut))}
.app.ctx-open .ctx{display:block;animation:dn .2s ease}
@keyframes dn{from{opacity:0;transform:translateY(-6px)}}
.scrim{display:none;position:absolute;inset:0;z-index:15;background:rgba(31,36,40,.22)}
.app.ctx-open .scrim{display:block}
.kpi{background:var(--slate);color:#fff;border-radius:12px;padding:14px 16px 16px}
.kpi h2{display:flex;justify-content:space-between;gap:8px;margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--slate-mute);font-weight:650}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.kg>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kg small{font-size:12px;color:var(--slate-mute)}
.kg b{font-size:23px;font-weight:650;letter-spacing:-.015em;font-variant-numeric:tabular-nums;line-height:1.2}
.kg span{font-size:12px;color:#DCE3EA}
.segs{display:flex;gap:2px;margin-top:5px}
.segs i{flex:1;height:4px;border-radius:1px;background:rgba(255,255,255,.2);transition:background .25s ease}
.segs i.on{background:var(--olive-lt)}
.nextb{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px 16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.nextb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--olive)}
.nextb h3{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--olive-ink);font-weight:700}
.nextb p{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.nrow{display:flex;align-items:center;gap:10px}
.nrow .btn{margin-left:auto}
.sec{margin-top:10px;border-top:1px solid var(--line)}
.secb{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.secb .n{font-size:11.5px;color:var(--ink3);letter-spacing:0;font-weight:600}
.secb .chev{margin-left:auto}
.secb[aria-expanded=false] .chev{transform:rotate(-90deg)}
.lst{list-style:none;margin:0 0 4px;padding:0}
.lst li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:8px 0 8px 10px;border-top:1px solid var(--line2);font-size:14px;position:relative}
.lst li:first-child{border-top:0}
.lst li::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--st,var(--line))}
.lst time,.lst .d{font-weight:600;font-variant-numeric:tabular-nums}
.lst small{display:block;color:var(--ink3);font-size:12.5px}
.lst .cap{margin-top:5px}
.foot{margin:2px 0 6px;font-size:12.5px;color:var(--ink3)}
.tm{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2);font-size:14px}
.tm:first-child{border-top:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.tm small{display:block;color:var(--ink3);font-size:12.5px}
.ctx-close{width:100%;margin-top:12px}

@media (max-width:999px){.ctx .kpi{display:none}.nextb{margin-top:8px}}
@media (min-width:1000px){
 :root{--gut:0px}
 .app{padding:0 24px}
 .top{padding:14px 0}
 .sub-m{display:none}.sub-d{display:inline}
 .date{display:inline}
 .strip{display:none}
 .main{grid-template-columns:minmax(0,1fr) 336px;column-gap:40px}
 .log{padding:8px 4px 28px}
 .comp{padding:12px 0 18px;border-top:1px solid var(--line)}
 .sugs{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
 .ctx{display:block;position:static;max-height:none;overflow-y:auto;box-shadow:none;border:0;border-left:1px solid var(--line);padding:20px 0 24px 28px;background:none;animation:none}
 .app.ctx-open .ctx{animation:none}
 .app.ctx-open .scrim,.scrim{display:none}
 .ctx-close{display:none}
 .w{max-width:620px}
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
 .dots i{opacity:.6}
}

function grow(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}
function addJ(parts,o={}){
 const g=document.createElement('div');g.className='g j'+(o.stat?' static':'');
 g.innerHTML=`<div class="who"><span class="mono" aria-hidden="true">J</span><b>Jarvis</b><span class="tn">${o.t||now()}</span></div>`+parts.filter(Boolean).join('');
 log.append(g);sync();g.querySelectorAll('textarea').forEach(grow);return g;
}
function addMe(text){const g=document.createElement('div');g.className='g me';g.innerHTML=`<div class="b">${esc(text)}</div><span class="stamp tn">${now()}</span>`;log.append(g);return g;}
function scrollToAnchor(a){const max=log.scrollHeight-log.clientHeight;let top=max;if(a){const y=log.scrollTop+a.getBoundingClientRect().top-log.getBoundingClientRect().top-10;if(y<top)top=y;}log.scrollTo({top:Math.max(0,top),behavior:RM.matches?'auto':'smooth'});}
let chain=Promise.resolve();
function respond(fn,anchor){
 chain=chain.then(async()=>{
  const t=document.createElement('div');t.className='g j typ';t.innerHTML='<div class="b dots" role="status" aria-label="Jarvis schreibt"><i></i><i></i><i></i></div>';
  log.append(t);scrollToAnchor(null);
  await wait(700);t.remove();
  const g=addJ(fn());scrollToAnchor(anchor||g);
 });
 return chain;
}
function send(text){text=String(text||'').trim();if(!text)return;closeCtx();tick();const me=addMe(text);scrollToAnchor(null);respond(()=>route(text),me);}
function act(id,src){
 if(S.done[id])return;
 const blk=src&&src.closest('[data-act]'),tx=blk&&blk.querySelector('textarea');if(tx)S.text[id]=tx.value;
 S.done[id]=tick();delete S.later[id];sync();
 respond(()=>{const left=Q.some(q=>!S.done[q.id]);return [bub(FOL[id]()+(left?'':' Damit ist alles erledigt, was heute ansteht. Ich melde mich, wenn etwas Neues reinkommt.')),nextSgs()];});
}
function later(id){S.later[id]=1;sync();respond(()=>[bub('Okay, liegt zurück – '+(LT[id]||'ich erinnere dich um 12:00')+'.'),nextSgs()]);}
function goNext(id){
 closeCtx();
 const q=Q.find(x=>x.id===id);if(!q)return;
 const ex=[...log.querySelectorAll(`[data-act="${id}"]`)].pop();
 if(ex&&!S.done[id]){
  if(S.later[id]){delete S.later[id];sync();}
  const y=log.scrollTop+ex.getBoundingClientRect().top-log.getBoundingClientRect().top-12;
  log.scrollTo({top:Math.max(0,y),behavior:RM.matches?'auto':'smooth'});
  ex.classList.remove('flash');void ex.offsetWidth;ex.classList.add('flash');
  const b=ex.querySelector('.acts .btn');if(b)b.focus({preventScroll:true});
  return;
 }
 send(q.ask);
}

function sync(){
 $$('[data-act]').forEach(el=>{const id=el.dataset.act,d=!!S.done[id];el.classList.toggle('is-done',d);el.querySelectorAll('textarea').forEach(t=>{t.readOnly=d;if(d&&S.text[id]!=null&&t.value!==S.text[id]){t.value=S.text[id];grow(t);}});});
 $$('.acts[data-for]').forEach(el=>{const id=el.dataset.for,sig=S.done[id]?'d':S.later[id]?'l':'o';if(el.dataset.sig===sig)return;el.dataset.sig=sig;el.innerHTML=actsHTML(id);});
 $$('[data-live]').forEach(el=>{el.innerHTML=LIVE[el.dataset.live]();});
 $$('[data-res]').forEach(b=>b.setAttribute('aria-pressed',String(S.reserve)));
 renderCtx();
}
function closeCtx(){app.classList.remove('ctx-open');strip.setAttribute('aria-expanded','false');}
function toggleCtx(){const o=!app.classList.contains('ctx-open');app.classList.toggle('ctx-open',o);strip.setAttribute('aria-expanded',String(o));if(o)ctx.scrollTop=0;}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,a');if(!t)return;
 const d=t.dataset;
 if(d.ask!=null){send(d.ask);return;}
 if(d.q){const q=Q.find(x=>x.id===d.q);if(q)send(q.ask);return;}
 if(d.next){goNext(d.next);return;}
 if(d.do){act(d.do,t);return;}
 if(d.later){later(d.later);return;}
 if(d.undo){delete S.later[d.undo];sync();return;}
 if(d.tog!=null){const x=t.getAttribute('aria-expanded')!=='true';t.setAttribute('aria-expanded',String(x));const p=document.getElementById(t.getAttribute('aria-controls'));if(p)p.hidden=!x;if(d.tog)S.open[d.tog]=x;return;}
 if(d.sec){const k=d.sec,x=!S.sec[k];S.sec[k]=x;t.setAttribute('aria-expanded',String(x));const p=document.getElementById('sec-'+k);if(p)p.hidden=!x;return;}
 if(d.res!=null){S.reserve=!S.reserve;sync();return;}
 if(d.wk!=null){const c=t.closest('[data-chart]');c.querySelectorAll('.wk').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));c.querySelector('.readout').innerHTML=readout(+d.wk);return;}
 if(t===strip||t.id==='scrim'||d.close!=null){toggleCtx();return;}
});
log.addEventListener('input',e=>{const t=e.target;if(t.matches('textarea[data-txt]')){S.text[t.dataset.txt]=t.value;grow(t);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&app.classList.contains('ctx-open')){closeCtx();strip.focus();}});
$('#comp').addEventListener('submit',e=>{e.preventDefault();const v=inp.value;inp.value='';send(v);});
window.addEventListener('resize',()=>$$('textarea.draft').forEach(grow));

],{stat:true,t:'07:38'});
