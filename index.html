 {v:'2.59',d:'2026-10-17',p:['Ruhigere Farben: Die App ist jetzt in gedecktem Anthrazit und Grau gehalten. Statusfarben (Grün, Orange, Rot) sind zurückhaltender, bunte Leuchteffekte sind weg.','Die frühere gelbgrüne Farbe gibt es weiter als Vorschlag unter Einstellungen → Akzentfarbe.']},
 {v:'2.58',d:'2026-10-17',p:['Anfragen aufgeräumt: Die Zahlen (Neu, Offen, Termine, Gewonnen) stehen jetzt kompakt in einer Zeile, darunter woher die Anfragen kommen. So sehen Sie die Anfragen selbst schneller.','Der Knopf für neue Anfragen heißt jetzt verständlich „Neue Anfragen nacheinander abarbeiten“. Die Symbole für WhatsApp, Anrufbeantworter usw. sind wieder sauber gezeichnet statt schwarz gefüllt.']},
 {v:'2.57',d:'2026-10-17',p:['Technik im Hintergrund: Das Aussehen der App liegt jetzt in einer eigenen Datei. Für Sie ändert sich nichts – Änderungen am Design gehen dadurch schneller und sicherer.']},
 {v:'2.56',d:'2026-10-17',p:['Neu: E-Rechnung für Firmenkunden. In Finanzen steht bei Rechnungen an Firmen der Knopf „E-Rechnung“. Er erzeugt eine XRechnung (XML-Datei), die ab 2028 für Firmenkunden Pflicht ist.','Fehlen dafür Angaben (z. B. echte IBAN, E-Mail des Kunden, Adresse mit PLZ), zeigt die App genau, was noch fehlt.']},
 {v:'2.55',d:'2026-10-16',p:['Kleine Korrektur: Wenn beim „Status an Kunden senden“ das Kopieren des Textes nicht klappt, sagt die App das jetzt deutlich, statt still zu scheitern.']},
 {v:'2.54',d:'2026-10-08',p:['Fehler behoben: Online-Terminanfragen von Kunden-Handys kommen jetzt bei Ihnen an. Die App holt sie alle 3 Minuten ab und zeigt sie unter „Anfragen“ als neu – bestätigt wird weiter nur von Ihnen.','Dafür braucht es das Cloud-Backup und den Befehl aus „Einmalige Einrichtung“. Danach hat Ihr Buchungslink eine neue Adresse – bitte den neuen Link weitergeben (Webseite, Google-Profil).']},
 {v:'2.53',d:'2026-10-08',p:['Neu: Statusseite für Kunden. Beim „Status an Kunden senden“ kann ein Link mitgeschickt werden. Darüber sieht der Kunde jederzeit den aktuellen Stand – ohne Namen und ohne Preise. Ändert sich der Status, ist die Seite automatisch aktuell.','Einmalig nötig: den neuen Befehl aus Einstellungen → Cloud-Backup → „Einmalige Einrichtung“ in Supabase ausführen. Er schützt außerdem Ihre Sicherung besser.']},
 {v:'2.52',d:'2026-10-08',p:['Neu in den Einstellungen unter „Erscheinungsbild“: Akzentfarbe frei wählbar. Tippen Sie auf einen Vorschlag oder wählen Sie über den bunten Kreis jede beliebige Farbe. Die App passt sich sofort an.','Die Schrift auf Knöpfen wird automatisch hell oder dunkel, damit sie auf jeder Farbe gut lesbar bleibt. Der erste Kreis stellt die Standardfarbe wieder her.']},
 {v:'2.51',d:'2026-10-06',p:['Terminkalender aufgeräumt: Alle sieben Tage passen jetzt aufs Handy, ohne seitlich zu wischen. Samstag und Sonntag sind leicht grau hinterlegt, der heutige Tag dezent markiert.','Uhrzeiten und Termine sind größer und besser lesbar. Neuer Knopf „Heute“ springt aus anderen Wochen zurück zur aktuellen Woche.']},
 {v:'2.50',d:'2026-10-06',p:['Neu im Auftrag: „Status an Kunden senden“. Die App schreibt die Nachricht fertig – Stand der Arbeit, wann das Auto voraussichtlich fertig ist, bei fertigen Autos der Betrag zur Abholung und die nächste HU.','Sie können den Text vor dem Senden ändern. Ein Tipp öffnet WhatsApp, und die Nachricht landet automatisch in der Kommunikation des Auftrags.']},
 {v:'2.49',d:'2026-10-06',p:['Auftragsliste aufgeräumt: Rechts steht jetzt der Preis, darunter der Status als kleines farbiges Schild und die Arbeitswerte dezent – kein Durcheinander mehr.','Der rote Punkt hinter der Auftragsnummer bedeutet „Notiz vorhanden“ – das wird jetzt auch so angesagt.']},
 {v:'2.48',d:'2026-10-05',p:['HU- und Wartungs-Erinnerungen an Kunden unterschreiben jetzt mit Ihrem Werkstattnamen aus den Einstellungen statt mit „mehanicar Meisterwerkstatt“.','Auf der Startseite steht nur noch „überfällig“, wenn es wirklich überfällig ist – sonst „bald fällig“, mit dem Tipp, Kunden 4–6 Wochen vorher anzuschreiben.']},
 {v:'2.47',d:'2026-10-05',p:['Fehler behoben: In den Einstellungen war der Knopf „Einschalten“ für die Zahl am App-Symbol zusammengequetscht – jetzt ist er normal breit.','Beispieltexte in leeren Feldern (z. B. „z. B. Inspektion“) sind jetzt hellgrau und dünn, damit man sie nicht für echte Eingaben hält.']},
 {v:'2.46',d:'2026-10-05',p:['Neu: Zahl am App-Symbol – auf dem Home-Bildschirm sehen Sie, wie viele Kundenanfragen noch unbeantwortet sind (Stand: letztes Öffnen der App).','Einschalten unter Mehr → Einstellungen → „Zahl am App-Symbol“. Das iPhone fragt dann einmal, ob mehanicar Mitteilungen anzeigen darf.']},
 {v:'2.45',d:'2026-10-05',p:['Finanzen übersichtlicher: Die Schalter „Sichtbare Bereiche“ sind jetzt klar als Knöpfe erkennbar – eingeschaltete sind dunkel mit Häkchen.','Das Diagramm erklärt seine Farben (Blau = Umsatz, Grün = Gewinn) und sagt deutlich, wenn noch keine Rechnungen da sind.']},
 {v:'2.44',d:'2026-10-04',p:['Bildschirm bleibt an: Solange in einem Auftrag die Zeiterfassung läuft, geht das Display nicht mehr aus. Sie müssen das Handy also nicht ständig neu entsperren, wenn es in der Werkstatt liegt.','Sobald Sie die Zeit pausieren oder den Auftrag fertig melden, verhält sich der Bildschirm wieder ganz normal.']},
 {v:'2.43',d:'2026-10-04',p:['Kundenliste ruhiger: Die Kürzel-Kreise sind nicht mehr bunt, sondern einheitlich – Firmenkunden in Schiefergrau, Privatkunden in Hellgrau.','Firmenkunden tragen jetzt ein kleines „Firma“-Schild, so erkennen Sie sie sofort.']},
 {v:'2.42',d:'2026-10-04',p:['Fenster lassen sich besser bedienen: Nach dem Schließen sind Sie wieder genau dort, wo Sie vorher waren. Am Computer schließt die Esc-Taste Fenster und Rückfragen.','Die Vorlesefunktion des iPhones nennt jetzt bei jedem Eingabefeld die passende Beschriftung, und ein Tipp auf die Beschriftung springt direkt ins Feld.']},
 {v:'2.41',d:'2026-10-04',p:['Startseite aufgeräumt: Im hellen Modus ist die Liste „Heute“ jetzt eine helle Karte statt eines dunklen Blocks – ruhiger und einheitlicher.','Die vier Zahlen-Kacheln oben sind ausgewogener und erklären kurz, was die Zahl bedeutet (z. B. „alles pünktlich“, „noch nicht abgerechnet“).']},
 {v:'2.40',d:'2026-10-03',p:['Weniger Nachfragen: Beim Löschen einer Position im Auftrag, eines Kommunikations-Eintrags, einer Arbeitsposition, eines Kombi-Vorschlags oder einer Paket-Vorlage fragt die App nicht mehr nach. Stattdessen erscheint unten 6 Sekunden lang „Rückgängig“.','Wichtige Löschungen (Auftrag, Kunde, Fahrzeug, Lagerteil, Foto, Rechnung) fragen weiterhin sicherheitshalber nach.']},
 {v:'2.39',d:'2026-10-03',p:['Besser lesbar: Die graue Zusatzschrift im hellen Modus ist etwas dunkler – gerade draußen oder bei Sonne gut zu erkennen.','Kleine „x“-Knöpfe (Schließen, Entfernen) lassen sich leichter treffen und werden von der iPhone-Vorlesefunktion richtig angesagt.']},
 {v:'2.38',d:'2026-10-03',p:['Bessere Erinnerung an die Datensicherung: Wenn länger als 7 Tage nicht gesichert wurde, meldet sich die App – auch wenn Sie noch nie gesichert haben. „X“ blendet sie für einen Tag aus.','Unter „Mehr“ sehen Sie jetzt immer, wann zuletzt gesichert wurde, und können mit einem Tipp sichern. Diese Sicherungsdatei lässt sich später wieder einspielen.']},
 {v:'2.37',d:'2026-10-03',p:['Vorbereitung E-Rechnung: Bei Firmenkunden können Sie jetzt die USt-IdNr. eintragen – sie steht dann auch auf der Rechnung.','Rechnungen an Firmen über 250 € sind in der Liste mit „E-Rechnung“ markiert. So sehen Sie, welche Kunden das später betrifft. Privatkunden ändert sich nichts.']},
 {v:'2.36',d:'2026-10-02',p:['„Teil hinzufügen“ aus dem Lager im neuen Stil: Oben sehen Sie sofort Preis, Aufschlag und ob genug im Regal liegt – oder ob das Teil bestellt werden muss.']},
 {v:'2.35',d:'2026-10-02',p:['Neue Eingabe für Arbeiten und Teile im Auftrag: Oben sehen Sie sofort den Preis – bei Arbeiten die Arbeitswerte, bei Teilen Einkauf, Verkauf und Ihren Aufschlag in Euro und Prozent.','Rabatt, Zahler, Bestellung und Notizen liegen in Bereichen zum Aufklappen – sie stören nur, wenn Sie sie brauchen.']},
 {v:'2.34',d:'2026-10-02',p:['Neue Fahrzeug-Eingabe: Oben sehen Sie das Kennzeichen wie ein echtes Nummernschild, dazu Marke, Modell und Halter – schon beim Tippen.','Die Angaben sind in Bereiche zum Auf- und Zuklappen sortiert: Halter, Fahrzeug, Technik, HU & Wartung, Farbe & Zustand. Auch der Fahrzeugschein-Scan füllt die Vorschau gleich mit aus.']},
 {v:'2.33',d:'2026-10-01',p:['Neue Kunden-Eingabe: Oben zeigt eine dunkle Karte schon beim Tippen, wie der Kunde später aussieht.','Statt einem langen Formular gibt es Bereiche zum Auf- und Zuklappen: Person, Kontakt, Adresse und Werkstatt-Infos. Die Zahlungsmoral wählen Sie mit einem Tipp.']},
 {v:'2.32',d:'2026-10-01',p:['Kurzbefehle in der Suche: „neuer auftrag“, „neuer kunde“, „neuer termin“ oder „bestellliste“ eintippen und antippen – schon geht es los.','„bestell“ plus Teilename (z. B. „bestell bremsbeläge“) legt nach einer Rückfrage direkt eine Bestellung für dieses Teil an. Verschickt wird dabei nichts.']},
 {v:'2.31',d:'2026-10-01',p:['Die Suche findet jetzt viel mehr: einzelne Arbeiten und Teile in Aufträgen, Rechnungen, Termine, Anfragen und das Lager.','Beispiel: „brems“ zeigt alle Bremsen-Aufträge, die Anfrage wegen quietschender Bremsen und die Bremsscheiben im Regal – ein Tipp öffnet den Treffer.']},
 {v:'2.30',d:'2026-10-01',p:['Neue Suche: Oben rechts auf die Lupe tippen und Name, Kennzeichen, Auftragsnummer oder Telefonnummer eintippen – Kunden, Fahrzeuge und Aufträge erscheinen sofort.','Kennzeichen finden Sie auch ohne Leerzeichen und Bindestrich, zum Beispiel „sm247“.']},
 {v:'2.29',d:'2026-09-30',p:['Rabatt mit einem Tipp: In der Kalkulation eines Auftrags können Sie jetzt direkt 5 % oder 10 % Rabatt auf den ganzen Auftrag geben – oder mit 0 % wieder wegnehmen.','Alle Summen, die Anzeige oben und „Zu zahlen bei Abholung“ rechnen sofort mit.']},
 {v:'2.28',d:'2026-09-30',p:['Im Auftrag unter „Kalkulation“ steht jetzt die ganze Rechnung Schritt für Schritt: Lohn mit Arbeitswerten, Teile mit Einkauf und Verkauf, Ihr Aufschlag, Rabatte, Anzahlung.','Ganz unten steht groß „Zu zahlen bei Abholung“ – und intern Ihr Gewinn mit einem Balken, wie viel davon Lohn und wie viel Teile sind.']},
 {v:'2.27',d:'2026-09-30',p:['Im Auftrag steht die Kalkulation jetzt oben in einem dunklen Kasten: Netto, MwSt, Brutto und Gewinn — beim Scrollen bleibt er sichtbar.','Darunter sehen Sie auf einen Blick die Anzahlung, was der Kunde noch zahlen muss und die Marge in Prozent.']},
 {v:'2.26',d:'2026-09-30',p:['Neu: „Was ist neu“ — unter Mehr auf die Versionsnummer tippen, dann sehen Sie hier jede Neuerung mit Datum.','Ein kleiner Punkt an der Versionsnummer zeigt, wenn es etwas Neues gibt, das Sie noch nicht angesehen haben.']},

 return {arbeiten,teile,sonst,lohn,teileVk,sonstVk,teileEk,posSum,rabPak,rabOrd,netto,mwst,brutto,gewinn,offenNetto,abgerBr,rabNurOffen,restAnz,zuZahlen,marge,lohnPct,

 if(over)return'#B53A3A';return{offen:'#8E8E93',arbeit:'#6E879C',teile:'#F0A34E',fertig:'#5AD07A',abgeholt:'#5AD07A'}[a.status]||'#8E8E93'}
function remainTime(a){
 if(!a.abgabe||['fertig','abgeholt'].includes(a.status))return null;
 const target=new Date(a.abgabe+'T'+(a.abgabeZeit||'23:59')).getTime();
 const diff=target-Date.now();
 if(diff<0)return{txt:'Überfällig',red:true};
 const h=Math.floor(diff/3600000);
 if(h<1)return{txt:'< 1 h',red:false};
 if(h<24)return{txt:h+' h',red:h<2};
 const d=Math.floor(h/24);
 if(d<7)return{txt:d+' d',red:false};
 return{txt:Math.round(d/7)+' Wo',red:false};
}

 const sub=a.status==='fertig'?'fertig · abholbereit':(p1?esc(p1.name):'—')+(prog>0&&prog<100?' · '+prog+' %':'');
 const zeit=a.status==='fertig'?fmt(ordNetto(a)):(over?(a.abgabeZeit||dLabel(a.abgabe))+' !':(a.abgabe===todayISO()?(a.abgabeZeit||''):dLabel(a.abgabe)));

 return `<div class="sw ${a.pinned?'pinned':''}" id="sw-${a.id}">

   <span class="sub fade-el">${sub}${aw>0?` · <b style="color:${dark?'rgba(255,255,255,.7)':'var(--ink2)'}">${pct1(aw)} AW</b>`:''}</span>

 const spark7=(()=>{const out=[];for(let i=6;i>=0;i--){const d=addDays(todayISO(),-i);

 if(row){const r=row.querySelector('.sw-row');const fl=document.createElement('div');fl.className='checkflash';fl.innerHTML=IC.check;r.appendChild(fl);

  setTimeout(()=>row.classList.add('out'),60);setTimeout(finish,620)}else finish();hap()};

let ordFilter='alle',ordQ='';
function ordRow(a,strip){
 const f=fzg(a.fzgId)||{},k=kunde(a.kundeId)||{};const sc=statL(a.status)[2],sl=ordStatusLabel(a);
 const noteFlag=a.notiz?`<span class="dotmark" style="margin-left:5px" title="Notiz vorhanden" aria-label="Notiz vorhanden" role="img"></span>`:'';
 const aw=totalAW(a);
 return `<div class="lrow" data-act="open" data-v="auftrag" data-id="${a.id}" ${strip?`style="box-shadow:inset 3px 0 0 ${strip}"`:''}>
  <div class="av" style="background:${sc}14;color:${sc}">${IC.car}</div>
  <div class="lt"><b>${esc(f.kennz||'—')} · ${esc((f.marke||'')+' '+(f.modell||''))}</b>
  <span>${esc(k.name||'')} · ${a.nr}${noteFlag}</span></div>
  <div class="lr"><b class="num">${fmt(ordNetto(a))}</b>
  <span class="ord-meta"><i class="ord-st" style="color:${sc};background:${sc}14">${sl}</i>${aw>0?`<em class="num">${pct1(aw)} AW</em>`:''}</span></div></div>`;
}
function vAuftraege(){
 let list=S.auftraege.slice().sort((a,b)=>(a.abgabe||'9999').localeCompare(b.abgabe||'9999'));
 if(ordFilter!=='alle')list=list.filter(a=>a.status===ordFilter);
 if(ordQ){const q=ordQ.toLowerCase();list=list.filter(a=>{const f=fzg(a.fzgId)||{},k=kunde(a.kundeId)||{};
  return [a.nr,f.kennz,f.marke,f.modell,k.name].join(' ').toLowerCase().includes(q)})}
 let listHtml;
 if(ordFilter==='alle'&&!ordQ&&list.length){
  /* Nach Dringlichkeit gruppieren */
  const t=todayISO(),w=addDays(t,7);
  const g={over:[],today:[],week:[],later:[],ready:[],done:[]};
  list.forEach(a=>{
   if(a.status==='abgeholt')g.done.push(a);
   else if(a.status==='fertig')g.ready.push(a);
   else if(a.abgabe&&a.abgabe<t)g.over.push(a);
   else if(a.abgabe===t)g.today.push(a);
   else if(a.abgabe&&a.abgabe<=w)g.week.push(a);
   else g.later.push(a)});
  g.done.sort((a,b)=>(b.abgabe||'').localeCompare(a.abgabe||''));
  const GRP=[['over','Überfällig','var(--red)','#B53A3A'],['today','Heute fällig','var(--blue)','#3E5A73'],
   ['week','Diese Woche','var(--ink2)',''],['later','Später / ohne Termin','var(--ink3)',''],
   ['ready','Abholbereit','var(--green)','#2E7650'],['done','Abgeholt (Archiv)','var(--ink3)','']];
  listHtml=GRP.map(([key,label,col,strip])=>{
   const it=g[key];if(!it.length)return '';
   const shown=key==='done'?it.slice(0,5):it;
   return `<div class="lbl" style="color:${col}">${label} · ${it.length}</div>
    <div class="card stag">${shown.map(a=>ordRow(a,strip)).join('')}
    ${key==='done'&&it.length>5?`<div style="padding:9px 15px;font-size:11px;color:var(--ink3);border-top:1px solid var(--line2)">+ ${it.length-5} weitere — über Statusfilter „Abgeholt" oder Suche erreichbar</div>`:''}</div>`}).join('');
 }else{
  listHtml=`<div class="card stag">${list.length?list.map(a=>ordRow(a,'')).join('')
   :'<div class="empty"><b>Keine Aufträge gefunden</b>Passe Suche oder Filter an.</div>'}</div>`;
 }
 const inner=`
  <div class="searchbar">${IC.search}<input placeholder="Kennzeichen, Kunde, Nummer" value="${esc(ordQ)}" data-input="ordQ"></div>
  <div class="pills">${[['alle','Alle'],...STATI.map(s=>[s[0],s[1]])].map(([v,l])=>{const c=v==='alle'?'#3E5A73':statL(v)[2];
   return `<button class="pill ${ordFilter===v?'on':''}" style="${ordFilter===v?`background:${c}14;border-color:${c};color:${c}`:''}" data-act="ord-filter" data-v="${v}">${l}</button>`}).join('')}</div>
  ${listHtml}`;
 return shell(inner,{title:'Aufträge',eyebrow:S.auftraege.length+' gesamt'})+`<button class="fab" data-act="ord-new" aria-label="Neuer Auftrag">+</button>`;
}

const _kpick={};
function kPickIni(k){return((k.name||k.firma||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}
function kPickSelHtml(id,k){
 const fz=S.fahrzeuge.filter(f=>f.kundeId===k.id);
 return `<div class="kpick-sel"><div class="kav">${kPickIni(k)}</div>
  <div style="min-width:0"><b>${esc(k.name)}</b><span>${esc(k.tel||'—')}${fz.length?' · '+fz.map(f=>f.kennz).join(', '):''}</span></div>
  <button class="kpick-x" data-kpick-clear="${id}">Ändern</button></div>`;
}
function kPickerHtml(id,preK){
 return `<div id="${id}-sel">${preK?kPickSelHtml(id,preK):''}</div>
  <div id="${id}-search" style="display:${preK?'none':'block'}">
   <div class="fld"><label>Bestehenden Kunden suchen</label>
    <input id="${id}-q" placeholder="Name, Telefon oder Kennzeichen tippen …" autocomplete="off"></div>
   <div id="${id}-res"></div></div>`;
}
function bindKPicker(id,onChange,preK){
 _kpick[id]=preK?preK.id:null;
 const q=$('#'+id+'-q'),res=$('#'+id+'-res'),selBox=$('#'+id+'-sel'),searchBox=$('#'+id+'-search');
 function select(k){_kpick[id]=k?k.id:null;
  selBox.innerHTML=k?kPickSelHtml(id,k):'';
  searchBox.style.display=k?'none':'block';
  if(!k&&q){q.value='';res.innerHTML='';setTimeout(()=>q.focus(),60)}
  if(onChange)onChange(k)}
 selBox.addEventListener('click',e=>{const b=e.target.closest('[data-kpick-clear]');if(b){e.preventDefault();select(null)}});
 res.addEventListener('click',e=>{const r=e.target.closest('[data-kid]');if(r)select(kunde(r.dataset.kid))});
 q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(!v){res.innerHTML='';return}
  const hits=S.kunden.filter(k=>{
   const kz=S.fahrzeuge.filter(f=>f.kundeId===k.id).map(f=>f.kennz).join(' ');
   return[k.name,k.firma,k.tel,kz].join(' ').toLowerCase().includes(v)}).slice(0,6);
  res.innerHTML=hits.length?`<div class="kpick-res">${hits.map(k=>{
   const fz=S.fahrzeuge.filter(f=>f.kundeId===k.id);
   return `<div class="kpick-row" data-kid="${k.id}"><div class="kav" style="background:var(--blue-bg);color:var(--blue)">${kPickIni(k)}</div>
    <div style="min-width:0;flex:1"><b>${esc(k.name)}</b><span>${esc(k.tel||'—')}${fz.length?' · '+fz.map(f=>f.kennz).join(', '):''}</span></div></div>`}).join('')}</div>`
   :`<div style="font-size:11.5px;color:var(--ink3);margin:-2px 2px 12px">Kein Treffer — unten einfach neu anlegen.</div>`;
 });
 return{get:()=>_kpick[id]?kunde(_kpick[id]):null,set:select};
}

     <div class="fld" style="margin:0"><label>Wer zahlt</label><div class="selwrap"><select data-f="p-zahler" data-oid="${a.id}" data-pid="${pk.id}" ${locked?'disabled':''}>

    ${pk.klass==='so'?`<div class="fld"><label>Sonstige — was genau?</label><input value="${esc(pk.klassTxt||'')}" placeholder="z. B. Gutachten" data-f="p-klass-txt" data-oid="${a.id}" data-pid="${pk.id}" ${locked?'disabled':''}></div>`:''}
    ${pk.zahler==='son'?`<div class="fld"><label>Sonstiges — wer zahlt?</label><input value="${esc(pk.zahlerTxt||'')}" placeholder="z. B. Versicherung Huk24" data-f="p-zahler-txt" data-oid="${a.id}" data-pid="${pk.id}" ${locked?'disabled':''}></div>`:''}
    ${befunde.length?'<div class="lbl">Befund & Abhilfe</div>'+befunde.map(posRow).join(''):''}
    ${arbeiten.length?'<div class="lbl">Arbeiten</div>'+arbeiten.map(posRow).join(''):''}
    ${teile.length?'<div class="lbl">Teile</div>'+teile.map(posRow).join(''):''}
    ${texte.length?'<div class="lbl">Textpositionen</div>'+texte.map(posRow).join(''):''}
    ${(()=>{const kb=apKombiFor(pk);return kb.length?kb.map(b=>`<button class="btn-ghost" style="width:100%;margin-bottom:6px;border-style:dashed;color:var(--violet);border-color:rgba(107,77,214,.4);text-align:left;font-size:11.5px" data-act="add-kombi" data-oid="${a.id}" data-pid="${pk.id}" data-bez="${esc(b)}">+ Passt oft dazu: ${esc(b)}</button>`).join(''):''})()}
    ${extPos.map(p=>p.extKommId?`<div class="ext-note">Erweiterung nachträglich vereinbart — ${esc(p.bez)}, ${fmt(posNetto(p))}. <span class="lk" data-act="goto-komm" data-oid="${a.id}">In Kommunikation ansehen</span></div>`:'').join('')}
    ${(()=>{const pf=a.fotos.filter(x=>x.paketId===pk.id);return pf.length?`<div class="lbl">Fotos zu diesem Paket</div>
     <div class="fgrid">${pf.map(fo=>fotoTile(a,fo)).join('')}${camTile(a,pk.id)}</div>`:''})()}
    ${pk.rabatt&&pk.rabatt.wert?`<div class="kv" style="border:none"><span class="k">Rabatt Paket</span><span class="v" style="color:var(--blue)">– ${pk.rabatt.typ==='pct'?pk.rabatt.wert+' %':fmt(pk.rabatt.wert)}</span></div>`:''}
    <div class="sum"><span class="sl">Paket netto · Gewinn <span class="gain"${pakGewinn(pk)<0?' style="color:var(--red)"':''}>${fmt(pakGewinn(pk))}</span></span><b class="num">${fmt(pakNetto(pk))}</b></div>
    ${locked?'':`<div style="display:flex;gap:7px;flex-wrap:wrap">
     <button class="btn-ghost" data-act="add-arbeit" data-oid="${a.id}" data-pid="${pk.id}" style="flex:1;min-width:80px">${ordFreigegeben(a)?'+ Arbeit (Erw.)':'+ Arbeit'}</button>
     <button class="btn-ghost" data-act="add-teil" data-oid="${a.id}" data-pid="${pk.id}" style="flex:1;min-width:80px">${ordFreigegeben(a)?'+ Teil (Erw.)':'+ Teil'}</button>
     <button class="btn-ghost" data-act="add-befund" data-oid="${a.id}" data-pid="${pk.id}" style="flex:1;min-width:80px">+ Befund</button>
     <button class="btn-ghost" data-act="add-text" data-oid="${a.id}" data-pid="${pk.id}" style="flex:1;min-width:80px">+ Text</button>
     <button class="btn-ghost" data-act="add-foto-btn" data-oid="${a.id}" data-pid="${pk.id}" style="flex:1;min-width:80px">+ Foto/Video</button></div>`}
    ${!pk.abger?`<button class="btn btn-soft-green" style="width:100%;margin-top:10px" data-act="bill-pak" data-oid="${a.id}" data-pid="${pk.id}">Nur dieses Paket abrechnen</button>`:''}
    ${locked?'':`<button class="btn-ghost" style="width:100%;margin-top:8px;color:var(--red);border-color:rgba(224,53,59,.3)" data-act="pak-del" data-oid="${a.id}" data-pid="${pk.id}">Paket löschen</button>`}
   </div></div></div>`};
 /* Kalkulationsmodus */
 const calcHtml=()=>{
  const discTog=(f,pid,rab)=>`<input class="priceinp" style="width:58px" inputmode="decimal" value="${rab.typ==='pct'?String(rab.wert).replace('.',','):fmtIn(rab.wert)}" data-f="${f}-w" data-oid="${a.id}" ${pid?`data-pid="${pid}"`:''}>
   <div class="disc-tog"><button class="${rab.typ==='eur'?'on':''}" data-act="${f}-t" data-oid="${a.id}" ${pid?`data-pid="${pid}"`:''} data-t="eur">€</button>
   <button class="${rab.typ==='pct'?'on':''}" data-act="${f}-t" data-oid="${a.id}" ${pid?`data-pid="${pid}"`:''} data-t="pct">%</button></div>`;
  const K=ordKalk(a),kr=(l,sub,v,cls='')=>`<div class="kr ${cls}"><span>${l}${sub?`<small>${sub}</small>`:''}</span><b class="num">${v}</b></div>`;
  const satz=p=>p.awSatz||a.awCt||S.settings.awCt;
  const detail=`<div class="kdet">
   ${K.arbeiten.length?`<div class="kgrp"><div class="kgt"><span>Arbeitslohn</span><span class="num">${fmt(K.lohn)}</span></div>
    ${K.arbeiten.map(p=>kr(esc(p.bez),p.aw?pct1(p.aw*(p.menge||1))+' AW × '+fmt(satz(p)):'',fmt(posNetto(p)))).join('')}
    ${kr('Summe Lohn',pct1(K.aw)+' AW gesamt',fmt(K.lohn),'sumr')}</div>`:''}
   ${K.teile.length?`<div class="kgrp"><div class="kgt"><span>Teile & Material</span><span class="num">${fmt(K.teileVk)}</span></div>
    ${K.teile.map(p=>kr(esc(p.bez),(p.menge||1)+' × EK '+fmt(p.ekCt)+' → VK '+fmt(p.vkCt),fmt(posNetto(p)))).join('')}
    ${kr('Teile-Aufschlag','VK − EK','+ '+fmt(K.teileVk-K.teileEk),'gw')}</div>`:''}
   ${K.sonst.length?`<div class="kgrp"><div class="kgt"><span>Sonstiges</span><span class="num">${fmt(K.sonstVk)}</span></div>
    ${K.sonst.map(p=>kr(esc(p.bez),'',fmt(posNetto(p)))).join('')}</div>`:''}
   ${a.pakete.length>1?`<div class="kgrp"><div class="kgt"><span>Pakete</span></div>
    ${a.pakete.map(pk=>kr(esc(pk.name),pk.pos.length+' Position'+(pk.pos.length!==1?'en':'')+(pk.abger?' · abgerechnet':''),fmt(pakNetto(pk)))).join('')}</div>`:''}
   <div class="kgrp"><div class="kgt"><span>Abzüge & Summen</span></div>
    ${kr('Zwischensumme','',fmt(K.posSum))}
    ${K.rabPak?kr('Rabatt auf Pakete','','− '+fmt(K.rabPak),'neg'):''}
    ${(()=>{const r=a.rabatt||{typ:'eur',wert:0},on=v=>(r.wert||0)===v&&(v===0||r.typ==='pct');
     return `<div class="kr neg krab"><span>Rabatt auf Auftrag</span><span class="rabq" role="group" aria-label="Rabatt auf Auftrag">${[0,5,10].map(v=>`<button class="${on(v)?'on':''}" data-act="orab-q" data-oid="${a.id}" data-r="${v}" aria-pressed="${on(v)}">${v} %</button>`).join('')}</span><b class="num">${K.rabOrd?'− '+fmt(K.rabOrd):'—'}</b></div>`})()}
    ${kr('Netto','',fmt(K.netto))}
    ${kr('MwSt '+S.settings.mwst+' %','',fmt(K.mwst))}
    ${kr('Brutto','',fmt(K.brutto),'strong')}
    ${K.abgerBr?kr('Bereits abgerechnet','Rechnungen','− '+fmt(K.abgerBr),'neg'):''}
    ${K.restAnz?kr('Anzahlung erhalten',a.anzVerrCt?'noch nicht verrechnet':'','− '+fmt(K.restAnz),'neg'):''}
    ${kr('Zu zahlen bei Abholung','',fmt(K.zuZahlen),'pay')}
    ${K.rabNurOffen?'<div class="khint">Ein nachträglich geänderter Rabatt gilt nur für die noch nicht abgerechneten Pakete. Deshalb ergibt Brutto minus Abgerechnetes hier nicht genau den offenen Betrag.</div>':''}</div>
   <div class="kgrp"><div class="kgt"><span>Ertrag (intern)</span></div>
    ${kr('Wareneinsatz','EK Teile','− '+fmt(K.teileEk))}
    ${kr('Deckungsbeitrag',K.marge+' % vom Netto',fmt(K.gewinn),K.gewinn<0?'neg':'gw')}
    ${K.lohn+K.teileVk?`<div class="kbar" role="img" aria-label="Lohn ${K.lohnPct} %, Teile ${100-K.lohnPct} %"><i style="width:${K.lohnPct}%;background:#2C3E50"></i><i style="width:${100-K.lohnPct}%;background:#7FA3C4"></i></div>
    <div class="kbl"><span><i style="background:#2C3E50"></i>Lohn ${K.lohnPct} %</span><span><i style="background:#7FA3C4"></i>Teile ${100-K.lohnPct} %</span></div>`:''}</div></div>
   <div class="lbl">Preise & Rabatte anpassen</div>`;
  return detail+a.pakete.map(pk=>`<div class="calc-pak">
   <div class="calc-ph"><span class="ct">${esc(pk.name)}</span><span class="tag ${KLASS[pk.klass][1]}">${KLASS[pk.klass][0].split(' ')[0]}</span></div>
   ${pk.pos.map(p=>`<div class="calc-row"><div class="cn">${esc(p.bez)}
     <div class="csub">${p.typ==='arbeit'?'Arbeit'+(p.aw?' · '+pct1(p.aw)+' AW':''):'Teil · EK '+fmt(p.ekCt)+' → <span class="gain">+'+fmt((p.vkCt-p.ekCt)*(p.menge||1))+'</span>'}${p.ext?' · Erweiterung':''}</div></div>
    ${p.typ==='teil'?`<input class="priceinp" style="width:44px" inputmode="numeric" value="${p.menge||1}" data-f="pos-menge" data-oid="${a.id}" data-pid="${pk.id}" data-xid="${p.id}">`:''}
    <input class="priceinp" inputmode="decimal" value="${fmtIn(p.vkCt)}" data-f="pos-vk" data-oid="${a.id}" data-pid="${pk.id}" data-xid="${p.id}"></div>`).join('')}
   <div class="disc"><span class="dl">Rabatt auf Paket</span>${discTog('prab',pk.id,pk.rabatt||{typ:'eur',wert:0})}</div>
   <div class="calc-tot"><span>Paket netto</span><span class="num">${fmt(pakNetto(pk))}<span class="gn">DB ${fmt(pakGewinn(pk))}</span></span></div></div>`).join('')+
  `<div class="card" style="padding:12px">
   <div class="disc" style="border:none;background:none;padding:0 0 10px"><span class="dl" style="color:var(--ink)">AW-Teiler dieses Auftrags</span>
    <input class="priceinp" style="width:64px" inputmode="decimal" value="${pct1(a.awTeiler||S.settings.awTeiler||1)}" data-f="o-teiler" data-oid="${a.id}">
    <span style="font-size:10px;color:var(--ink3)">Std. ${pct1(S.settings.awTeiler||1)}</span></div>
   <div class="disc" style="border:none;background:none;padding:0 0 10px"><span class="dl" style="color:var(--ink)">AW-Satz dieses Auftrags</span>
    <input class="priceinp" style="width:80px" inputmode="decimal" value="${fmtIn(a.awCt||S.settings.awCt)}" data-f="o-awsatz" data-oid="${a.id}">
    <span style="font-size:10px;color:var(--ink3)">Std. ${fmt(S.settings.awCt)}</span></div>
   <div class="disc" style="border:none;background:none;padding:0 0 10px"><span class="dl" style="color:var(--ink)">Gesamtrabatt auf Auftrag</span>${discTog('orab',null,a.rabatt||{typ:'eur',wert:0})}</div>
   <div class="kv"><span class="k">Zwischensumme netto</span><span class="v num">${fmt(ordSub(a))}</span></div>
   <div class="kv"><span class="k">Rabatte gesamt</span><span class="v num" style="color:var(--blue)">– ${fmt(ordSub(a)-ordNetto(a)+a.pakete.reduce((s,pk)=>s+rabCt(pakBrutto(pk),pk.rabatt),0)+a.pakete.reduce((s,pk)=>s+pk.pos.reduce((x,p)=>x+rabCt(Math.round(p.vkCt*(p.menge||1)),p.rab),0),0))}</span></div>
   <div class="kv"><span class="k">Gewinn (DB)</span><span class="v num gain">${fmt(ordGewinn(a))}</span></div></div>`};
 const secPak=sec('pak','Pakete & Kalkulation',a.pakete.length+' Paket'+(a.pakete.length!==1?'e':''),`
  <button class="btn btn-2nd kt-voll-btn" data-act="kalk-voll" data-oid="${a.id}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Positionen im Vollbild bearbeiten</button>
  <div class="seg" style="margin-bottom:13px">
   <button class="${mode==='liste'||mode==='over'?'on':''}" data-act="calc-mode" data-oid="${a.id}" data-m="liste">Bericht</button>
   <button class="seg-tab ${mode==='tab'?'on':''}" data-act="calc-mode" data-oid="${a.id}" data-m="tab">Tabelle</button>
   <button class="${mode==='calc'?'on':''}" data-act="calc-mode" data-oid="${a.id}" data-m="calc">Kalkulation</button></div>
  ${mode==='over'?a.pakete.map(pakHtml).join('')+`
   <div class="klass" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px">
    <span style="font-size:10px;color:var(--ink3);font-weight:700;letter-spacing:.06em">NEUES PAKET</span>
    ${Object.entries(KLASS).map(([v,[l]])=>`<button class="chip" data-act="pak-new" data-oid="${a.id}" data-k="${v}">${l}</button>`).join('')}
    <button class="chip" style="border-style:dashed;color:var(--violet);border-color:rgba(107,77,214,.4);display:inline-flex;align-items:center;gap:5px" data-act="pak-from-vorlage" data-oid="${a.id}"><span style="width:13px;height:13px;display:block">${IC.stack.replace('<svg ','<svg style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:100%;height:100%" ')}</span>Aus Vorlage</button></div>`
   :mode==='liste'?lsHtml(a)
   :mode==='tab'?ktHtml(a)+`<div class="klass" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px">
    <span style="font-size:10px;color:var(--ink3);font-weight:700;letter-spacing:.06em">NEUES PAKET</span>
    ${Object.entries(KLASS).map(([v,[l]])=>`<button class="chip" data-act="pak-new" data-oid="${a.id}" data-k="${v}">${l}</button>`).join('')}</div>`
   :calcHtml()}
  <div class="card" style="margin-top:10px;padding:12px"><div style="font-weight:600;font-size:12px;margin-bottom:6px">Anzahlung</div>
   <input class="priceinp" style="width:100%" inputmode="decimal" value="${fmtIn(a.anzahlungCt)}" data-f="o-anz" data-oid="${a.id}">
   <div style="font-size:10px;color:var(--ink3);margin-top:4px">${a.anzVerrCt?fmt(a.anzVerrCt)+' bereits mit Rechnungen verrechnet · ':''}wird auf der nächsten Rechnung abgezogen — noch verfügbar: ${fmt(Math.max(0,(a.anzahlungCt||0)-(a.anzVerrCt||0)))}</div></div>`);

 /* --- Kommunikation --- */
 const kanalName={wa:'WhatsApp',call:'Anruf',mail:'E-Mail',pers:'Persönlich',diag:'Diagnose',man:'Notiz',sys:'System',ig:'Instagram'};
 const teHtml=m=>{const pend=m.status==='ki';const just=lastConf===m.id;
  const bezug=m.bezug?a.pakete.find(p=>p.id===m.bezug):null;
  /* System-Einträge: platzsparende Einzeiler — Info-Knopf klappt Details auf */
  if(m.kanal==='sys'&&!pend){
   return `<div class="te-sys" data-act="te-tog">
    <span class="dt">${dtLabel(m.ts)}</span><span class="tx">${esc(m.txt)}${bezug?' <span class="tag t-blue" style="font-size:9px">'+esc(bezug.name)+'</span>':''}</span>
    <span class="inf">i</span></div>`}
  const src=m.kanal==='wa'?['Originalnachricht ansehen','wa']:m.kanal==='call'?['Aufnahme / Transkript','rec']:m.kanal==='mail'?['E-Mail öffnen','mail']:['Eintrag bearbeiten','edit'];
  return `<div class="te ${m.kanal} ${pend?'pend':''} ${just?'just-conf':''}">
   <div class="te-h"><span class="ch">${kanalName[m.kanal]||m.kanal}</span><span class="sep">·</span><span>${dtLabel(m.ts)}</span>
    ${pend?'<span class="tag t-amber">Vorschlag</span>':just?'<span class="tag t-green">soeben bestätigt</span>':m.status==='best'?'<span class="tag t-green">bestätigt</span>':'<span class="tag t-gray">manuell</span>'}</div>
   <div class="te-txt">${esc(m.txt)}</div>
   ${bezug?`<div class="te-badges"><span class="tag t-blue">${esc(bezug.name)}</span></div>`:''}
   <button class="src-btn" data-act="komm-src" data-oid="${a.id}" data-mid="${m.id}" data-s="${src[1]}">${src[0]}</button>
   ${pend?`<div class="te-btns">
    <button class="te-btn" style="background:var(--green);color:#fff" data-act="komm-ok" data-oid="${a.id}" data-mid="${m.id}">Bestätigen</button>
    <button class="te-btn" style="background:var(--bg);border:1px solid var(--line)" data-act="komm-edit" data-oid="${a.id}" data-mid="${m.id}">Korrigieren</button></div>`:''}
  </div>`};
 const kommSorted=a.komm.slice().sort((x,y)=>y.ts-x.ts);
 const kommGespr=kommSorted.filter(m=>m.kanal!=='sys'||m.status==='ki');
 const kommSys=kommSorted.filter(m=>m.kanal==='sys'&&m.status!=='ki');
 const secKomm=sec('komm','Kommunikation & Auftragshistorie',kiCount?`<span style="color:var(--amber);font-weight:600">${kiCount} zu bestätigen</span>`:`<span style="color:var(--green);font-weight:600">alle bestätigt</span>`,`
  <div class="ai-bar"><span class="ai-dot ${kiCount?'':'ok'}"></span>
   <span><b>Assistent aktiv.</b> Liest WhatsApp, E-Mail und Telefonate mit und legt Einträge an — du bestätigst nur noch.</span></div>
  ${kommGespr.length?`<div class="tl">${kommGespr.map(teHtml).join('')}</div>`:'<div class="empty" style="padding:20px"><b>Noch keine Einträge</b>Gespräche und Nachrichten erscheinen hier.</div>'}
  ${kommSys.length?`<div class="lbl">Auftragshistorie · ${kommSys.length} Einträge</div>
   <div style="background:var(--bg);border:1px solid var(--line2);border-radius:11px;padding:2px 10px">${kommSys.map(teHtml).join('')}</div>`:''}
  <button class="man-btn btn-ghost" style="width:100%;margin-top:14px" data-act="komm-new" data-oid="${a.id}">Eintrag manuell hinzufügen</button>`);
 route._kommSec='sec-komm';

 /* --- Fotos --- */
 const globalF=a.fotos.filter(x=>!x.paketId);
 const pakWithF=a.pakete.filter(p=>a.fotos.some(x=>x.paketId===p.id));
 const secFoto=sec('foto','Service',a.fotos.length+' Foto'+(a.fotos.length!==1?'s':''),`
  <div class="lbl" style="margin-top:2px">Annahme / Allgemein</div>
  <div class="fgrid">${globalF.map(fo=>fotoTile(a,fo)).join('')}${camTile(a,'')}</div>
  ${pakWithF.map(p=>`<div class="lbl">Paket „${esc(p.name)}"</div>
   <div class="fgrid">${a.fotos.filter(x=>x.paketId===p.id).map(fo=>fotoTile(a,fo)).join('')}${camTile(a,p.id)}</div>`).join('')}
  <div style="font-size:11px;color:var(--ink3);margin-top:10px">Jedes Foto trägt seinen Speicherort — Annahme, Allgemein oder das jeweilige Paket.</div>`);

 /* --- Stechuhr & Dokumente --- */
 const ms=istMs(a),eff=effizienz(a);
 const clDone=(a.check||[]).filter(c=>c.done).length;
 const secZeit=sec('zeit','Stechuhr & Dokumente',`<span class="num mini-tick" data-tick="${a.id}">--:--:--</span>`,`
  ${maChips(a)}
  <div class="timer"><div class="tt num" data-tick="${a.id}">00:00:00</div>
   <div class="eff"><div>Ist<b class="num" data-ist="${a.id}">${(ms/3600000).toFixed(2).replace('.',',')} h</b></div>
    <div>Verkauft<b class="num">${pct1(soldAW(a))} AW</b></div>
    <div>Effizienz<b class="num ${eff?(eff>=100?'hi':'lo'):''}" data-eff="${a.id}">${eff?eff+' %':'—'}</b></div></div>
   <div class="tbtns">
    <button class="tbtn" style="background:${a.timerStart?'var(--amber)':'var(--green)'};color:#fff" data-act="timer-tog" data-oid="${a.id}">${a.timerStart?'Pause':'Start'}</button>
    <button class="tbtn" style="background:var(--bg);color:var(--ink2);border:1px solid var(--line)" data-act="timer-reset" data-oid="${a.id}">Zurücksetzen</button></div>
   ${a.timerStart&&('wakeLock' in navigator)?'<div class="wl-hint">Bildschirm bleibt an, solange die Zeit läuft.</div>':''}</div>

/* Kunden-Status per WhatsApp (Kundenportal Stufe A, docs/kundenportal.md) — ohne Server, Text vor dem Senden änderbar */
function statusMsg(a){
 const k=kunde(a.kundeId)||{},f=fzg(a.fzgId)||{},fz=[[f.marke,f.modell].filter(Boolean).join(' '),f.kennz?'('+f.kennz+')':''].filter(Boolean).join(' ')||'Ihr Fahrzeug';
 const teilEta=a.pakete.flatMap(pk=>pk.pos).filter(p=>p.best==='bestellt'&&p.eta).map(p=>p.eta).sort().pop();
 const st={offen:'wir haben Ihr Fahrzeug angenommen und beginnen in Kürze',arbeit:'wir arbeiten gerade daran',
  teile:'wir warten noch auf Ersatzteile'+(teilEta?' (Lieferung voraussichtlich '+dLabel(teilEta)+')':''),
  fertig:'Ihr Fahrzeug ist fertig und kann abgeholt werden',abgeholt:'vielen Dank für Ihren Besuch'}[a.status]||ordStatusLabel(a);
 const z=[];
 if(!['fertig','abgeholt'].includes(a.status)&&a.abgabe)z.push('Voraussichtlich fertig: '+dLabel(a.abgabe)+(a.abgabeZeit?' um '+a.abgabeZeit+' Uhr':'')+'.');
 if(a.status==='fertig'){const K=ordKalk(a);if(K.zuZahlen>0)z.push('Zu zahlen bei Abholung: '+fmt(K.zuZahlen)+'.')}
 if(f.hu){const[y,m]=f.hu.split('-');z.push('Nächste Hauptuntersuchung: '+m+'/'+y+'.')}
 const tel=(S.settings.firma||{}).tel;
 return 'Guten Tag'+(k.name?' '+k.name:'')+', kurzer Stand zu Ihrem '+fz+': '+st+'. '+z.join(' ')+(tel?' Bei Fragen erreichen Sie uns unter '+tel+'.':'')+' '+wsGruss()}
/* Kunden-Statusseite (Stufe B): nur gekürztes Kennzeichen, Status, Termin, HU-Monat, Werkstatt-Kontakt. Kein Name, keine Preise. */
const STL_TAG=86400000;
function kzKurz(kz){kz=(kz||'').trim();if(!kz)return'';const m=kz.match(/^(.*?)(\d+)([EH]?)$/);return m?m[1]+m[2].slice(0,1)+'•'.repeat(Math.max(0,m[2].length-1))+m[3]:kz}
function statusDaten(a){const f=fzg(a.fzgId)||{},fi=S.settings.firma||{};
 const teilEta=a.pakete.flatMap(pk=>pk.pos).filter(p=>p.best==='bestellt'&&p.eta).map(p=>p.eta).sort().pop()||'';
 return{ws:fi.name||'',tel:fi.tel||'',adr:fi.adresse||'',kz:kzKurz(f.kennz),fz:[f.marke,f.modell].filter(Boolean).join(' '),st:a.status,
  fertig:!['fertig','abgeholt'].includes(a.status)&&a.abgabe?a.abgabe+(a.abgabeZeit?' '+a.abgabeZeit:''):'',teile:a.status==='teile'?teilEta:'',
  hu:f.hu?f.hu.split('-').reverse().join('/'):''}}
function stlId(){const b=new Uint8Array(16);crypto.getRandomValues(b);return[...b].map(x=>x.toString(16).padStart(2,'0')).join('')}
function statusLinkUrl(a){return location.origin+location.pathname+'#/status/'+a.statusLink.id}
function statusLinkAblauf(a){const L=a.statusLink;if(a.status==='abgeholt'){L.abg=L.abg||Date.now();return L.abg+30*STL_TAG}L.abg=0;return Date.now()+60*STL_TAG}
async function statusLinkPush(a){const c=syncCfg();if(!c.on||!c.id||!a.statusLink)throw new Error('Cloud-Backup ist aus');
 const d=statusDaten(a),h=JSON.stringify(d)+a.status;
 const r=await sbRpc('status_put',{p_backup_id:c.id,p_id:a.statusLink.id,p_data:{...d,upd:Date.now()},p_expires:new Date(statusLinkAblauf(a)).toISOString()});
 if(!r.ok)throw new Error(r.status===404?'Statusseite noch nicht eingerichtet':'Server-Antwort '+r.status);
 a.statusLink.h=h}
/* Online-Terminbuchung über Supabase: Kunde schreibt nur hinein (anfrage_neu), Werkstatt holt mit ihrem Backup-Code ab */

let buchInfoH='';
async function buchungAnmelden(){const c=syncCfg();if(!c.on||!c.id)return;
 if(!S.settings.buchId){S.settings.buchId=stlId().slice(0,20);save()}
 const fi=S.settings.firma||{},info={ws:fi.name||'',tel:fi.tel||'',adr:fi.adresse||'',email:fi.email||'',web:fi.web||''},h=JSON.stringify(info);
 if(h===buchInfoH)return;
 try{const r=await sbRpc('buchung_an',{p_backup_id:c.id,p_buch_id:S.settings.buchId,p_info:info});if(r.ok)buchInfoH=h}catch(e){}}
let holT=null;
async function anfragenHolen(){const c=syncCfg();if(!c.on||!c.id||!S.settings.buchId)return 0;
 try{const r=await sbRpc('anfragen_holen',{p_backup_id:c.id});if(!r.ok)return 0;
  const rows=await r.json();if(!Array.isArray(rows)||!rows.length)return 0;
  rows.forEach(d=>{if(!d||(S.anfragen||[]).some(q=>q.rid===d.rid))return;S.anfragen.push(anfrageAusBuchung(d))});
  save();render();toast(rows.length===1?'Neue Online-Terminanfrage':rows.length+' neue Online-Terminanfragen');syncBadge();return rows.length}
 catch(e){return 0}}
function anfragenTakt(){clearTimeout(holT);holT=setTimeout(async()=>{if(document.visibilityState==='visible')await anfragenHolen();anfragenTakt()},180000)}

async function statusLinksPush(){if(stlBusy)return;stlBusy=true;
 try{for(const a of S.auftraege.filter(o=>o.statusLink&&!(o.statusLink.abg&&o.statusLink.abg+30*STL_TAG<Date.now()))){

 finally{stlBusy=false}}

  cv.width=r.width*2;cv.height=240;ctx.scale(2,2);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#16161A';cv._sized=true;return true};
 setTimeout(size,80);

 const st=e=>{if(!cv._sized&&!size())return;d=true;[lx,ly]=pos(e);e.preventDefault()};
 const mv=e=>{if(!d)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();[lx,ly]=[x,y];cv._drawn=true;e.preventDefault()};
 const end=()=>d=false;
 cv.addEventListener('mousedown',st);cv.addEventListener('mousemove',mv);
 cv.addEventListener('mouseup',end);cv.addEventListener('mouseleave',end);
 cv.addEventListener('touchstart',st,{passive:false});cv.addEventListener('touchmove',mv,{passive:false});cv.addEventListener('touchend',end);cv.addEventListener('touchcancel',end)})}

/* ---- Rechnung / Druck ---- */
function buildInvoiceHtml(a,pakIds,reNr){
 const k=kunde(a.kundeId)||{},f=fzg(a.fzgId)||{},fi=S.settings.firma;
 const paks=a.pakete.filter(p=>pakIds.includes(p.id));
 const sub=paks.reduce((s,pk)=>s+pakNetto(pk),0);
 const ordRabAnteil=ordSub(a)>0?Math.round(rabCt(ordSub(a),a.rabatt)*sub/ordSub(a)):0;
 const netto=Math.max(0,sub-ordRabAnteil);
 const mwst=Math.round(netto*S.settings.mwst/100),brutto=netto+mwst;
 const restAnz=Math.max(0,(a.anzahlungCt||0)-(a.anzVerrCt||0));
 const anz=Math.min(restAnz,brutto);
 const rows=paks.map(pk=>{
  const prab=rabCt(pakBrutto(pk),pk.rabatt);
  return `<tr class="paksep"><td colspan="4">${esc(pk.name)} · ${pk.klass==='so'&&pk.klassTxt?esc(pk.klassTxt):KLASS[pk.klass][0]}${pk.zahler!=='kunde'?' · zahlt: '+(pk.zahler==='son'&&pk.zahlerTxt?esc(pk.zahlerTxt):ZAHLER[pk.zahler]):''}</td></tr>`+
  (pk.problem?`<tr><td colspan="4" style="font-size:10px;color:#444;white-space:pre-wrap"><b>Beanstandung:</b> ${esc(pk.problem)}</td></tr>`:'')+
  (pk.pruefung?`<tr><td colspan="4" style="font-size:10px;color:#444;white-space:pre-wrap"><b>Prüfung:</b> ${esc(pk.pruefung)}</td></tr>`:'')+
  pk.pos.map(p=>(p.typ==='text'||p.typ==='befund')?
   `<tr><td colspan="4" style="font-size:10px;color:#444">${p.typ==='befund'?'<b>Befund:</b> ':'<b>Hinweis:</b> '}${esc(p.bez)}${p.abhilfe?' — Abhilfe: '+esc(p.abhilfe):''}</td></tr>`
  :`<tr><td>${p.code?'<span style="font-size:9px;color:#555">'+esc(p.code)+'</span> ':''}${esc(p.bez)}${p.ext?' (Erweiterung)':''}${p.zahler&&p.zahler!==(pk.zahler||'kunde')?' <span style="font-size:9px;color:#555">· zahlt: '+(p.zahler==='son'&&p.zahlerTxt?esc(p.zahlerTxt):ZAHLER[p.zahler]||'')+'</span>':''}${p.notizKunde?'<br><span style="font-size:9px;color:#555;white-space:pre-wrap">'+esc(p.notizKunde)+'</span>':''}</td>
   <td class="tr">${p.typ==='teil'?(p.menge||1)+' ×':(p.aw?String(p.aw).replace('.',',')+' AW':'')}</td>
   <td class="tr">${fmt(p.vkCt)}</td><td class="tr">${fmt(posNetto(p))}</td></tr>`).join('')+
  (prab?`<tr><td colspan="3">Rabatt Paket</td><td class="tr">– ${fmt(prab)}</td></tr>`:'')}).join('');
 return {netto,mwst,brutto,anz,html:`
  <div class="ph"><div><h1>${esc(fi.name)}</h1><div class="small">${esc(fi.adresse)}<br>${esc(fi.tel)} · ${esc(fi.email)}${fi.ustid?'<br>USt-IdNr.: '+esc(fi.ustid):fi.steuernr?'<br>Steuernr.: '+esc(fi.steuernr):''}</div></div>
   <div class="small" style="text-align:right"><b style="font-size:14px;color:#111">${reNr?'Rechnung '+reNr:'Auftragsübersicht'}</b><br>
    Rechnungsdatum: ${new Date().toLocaleDateString('de-DE')}<br>Leistungsdatum: ${new Date((a.abgabe||todayISO())+'T00:00').toLocaleDateString('de-DE')}<br>Auftrag: ${a.nr}<br>Fahrzeug: ${esc(f.kennz||'')} · ${esc((f.marke||'')+' '+(f.modell||''))}<br>
    ${a.kmAn!=null?'KM: '+a.kmAn.toLocaleString('de-DE'):''}</div></div>
  <div class="small" style="margin-bottom:4px">Kunde</div>
  <div><b>${esc(k.name||'')}</b>${k.ansprechpartner?'<br>z. Hd. '+esc(k.ansprechpartner):''}<br><span class="small">${esc(k.adresse||'')}${k.ustid?'<br>USt-IdNr.: '+esc(k.ustid):''}</span></div>
  <table><tr><th>Position</th><th class="tr">Menge</th><th class="tr">Einzel</th><th class="tr">Gesamt</th></tr>${rows}</table>
  <div class="tots">
   ${ordRabAnteil?`<div><span>Rabatt Auftrag</span><span>– ${fmt(ordRabAnteil)}</span></div>`:''}
   <div><span>Netto</span><span>${fmt(netto)}</span></div>
   <div><span>MwSt ${S.settings.mwst} %</span><span>${fmt(mwst)}</span></div>
   <div class="big"><span>Brutto</span><span>${fmt(brutto)}</span></div>
   ${anz?`<div><span>abzgl. Anzahlung</span><span>– ${fmt(anz)}</span></div><div class="big"><span>Zu zahlen</span><span>${fmt(brutto-anz)}</span></div>`:''}
  </div>
  <div class="foot">${S.settings.garantieMonate>0?S.settings.garantieMonate+' Monate Garantie auf alle Arbeiten. ':''}${reNr?'Zahlbar innerhalb von '+(S.settings.mahnTage||14)+' Tagen ohne Abzug.':'Unverbindliche Übersicht — keine Rechnung.'}
   ${fi.iban?'<br>IBAN: '+esc(fi.iban):''}${fi.web?' · '+esc(fi.web):''}</div>`};
}

function doBill(a,pakIds){
 const paks=a.pakete.filter(p=>pakIds.includes(p.id));
 confirmBox('Rechnung erstellen?',paks.map(p=>'„'+esc(p.name)+'"').join(', ')+' wird abgerechnet und als Rechnung gedruckt.','Rechnung erstellen',()=>{
  const y=new Date().getFullYear();
  const reNr='RE-'+y+'-'+String(S.settings.nextRe++).padStart(4,'0');
  const inv=buildInvoiceHtml(a,pakIds,reNr);
  const gewinn=paks.reduce((s,pk)=>s+pakGewinn(pk),0);
  S.rechnungen.push({id:'r'+uid(),nr:reNr,auftragId:a.id,datum:todayISO(),nettoCt:inv.netto,mwstCt:inv.mwst,bruttoCt:inv.brutto,gewinnCt:gewinn,paketIds:pakIds,
   anzCt:inv.anz||0,leistung:a.abgabe||todayISO(),mwstSatz:S.settings.mwst,pos:rePosSnap(paks)});
  a.komm.push({id:'m'+uid(),kanal:'sys',ts:Date.now(),txt:'Rechnung '+reNr+' erstellt — '+fmt(inv.brutto)+' brutto.',preisCt:inv.brutto,vorherCt:null,nachherCt:null,bezug:null,status:'best',orig:null});
  paks.forEach(p=>{p.abger=true;if(p.status!=='fertig')p.status='fertig'});
  if(inv.anz)a.anzVerrCt=(a.anzVerrCt||0)+inv.anz;
  if(a.pakete.every(p=>p.abger)&&a.status!=='abgeholt')a.status='fertig';
  save();render();toast(reNr+' erstellt');
  $('#printarea').innerHTML=inv.html;setTimeout(()=>window.print(),120)},false)}

/* ---- E-Rechnung (XRechnung 3.0, CII) – wird komplett im Browser erzeugt ---- */
function rePosSnap(paks){return paks.flatMap(pk=>pk.pos.filter(p=>p.typ!=='text'&&p.typ!=='befund'&&posNetto(p)>0)
 .map(p=>({bez:(p.bez||'Position').slice(0,200),typ:p.typ,menge:p.menge||1,vkCt:p.vkCt,nettoCt:posNetto(p)})))}
function adrTeile(s){s=(s||'').trim();const m=s.match(/^(.*?)[,\n]\s*(?:D-)?(\d{5})\s+(.+)$/);return m?{str:m[1].trim(),plz:m[2],ort:m[3].trim()}:null}
function xmlEsc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
const eurX=ct=>(Math.round(ct)/100).toFixed(2);
function eRechDaten(r){const a=auftrag(r.auftragId),k=a?kunde(a.kundeId)||{}:{},fi=S.settings.firma||{};
 const pos=r.pos||rePosSnap(a?a.pakete.filter(p=>(r.paketIds||[]).includes(p.id)):[]);
 const fehl=[];
 const sa=adrTeile(fi.adresse),ka=adrTeile(k.adresse);
 if(!fi.name)fehl.push('Werkstattname (Einstellungen)');
 if(!sa)fehl.push('Werkstatt-Adresse im Format „Straße Nr, PLZ Ort“ (Einstellungen)');
 if(!fi.ustid&&!fi.steuernr)fehl.push('USt-IdNr. oder Steuernummer der Werkstatt (Einstellungen)');
 if(!fi.iban||/^DE0{2}\s?0{4}/.test(fi.iban.replace(/\s/g,'').slice(0,8)+' '))fehl.push('echte IBAN (Einstellungen)');
 if(!fi.email)fehl.push('E-Mail der Werkstatt (Einstellungen)');
 if(!fi.tel)fehl.push('Telefon der Werkstatt (Einstellungen)');
 if(!k.name)fehl.push('Name des Kunden');
 if(!ka)fehl.push('Kunden-Adresse im Format „Straße Nr, PLZ Ort“');
 if(!k.email)fehl.push('E-Mail des Kunden (für die elektronische Zustellung)');
 if(!pos.length)fehl.push('Rechnungspositionen (Auftrag nicht mehr vorhanden)');
 const zeilen=pos.reduce((x,p)=>x+p.nettoCt,0);
 return{a,k,fi,pos,sa,ka,fehl,zeilen,nachlass:Math.max(0,zeilen-r.nettoCt)}}
function xrechnungXml(r){const d=eRechDaten(r),{a,k,fi,pos,sa,ka}=d,satz=r.mwstSatz??S.settings.mwst;

 const adr=x=>`<ram:PostalTradeAddress><ram:PostcodeCode>${xmlEsc(x.plz)}</ram:PostcodeCode><ram:LineOne>${xmlEsc(x.str)}</ram:LineOne><ram:CityName>${xmlEsc(x.ort)}</ram:CityName><ram:CountryID>DE</ram:CountryID></ram:PostalTradeAddress>`;
 return`<?xml version="1.0" encoding="UTF-8"?>

<rsm:SupplyChainTradeTransaction>
${pos.map(zeile).join('\n')}

ACT['schein-scan']=el=>{

 if(!inp._b){inp._b=true;inp.addEventListener('change',e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;

  /* PDF (z. B. Fahrzeugschein als Datei auf dem iPhone): direkt als Base64 senden */
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name||'')){
   const rd=new FileReader();
   rd.onload=()=>{const b64=String(rd.result).split(',')[1];inp._send('application/pdf',b64)};
   rd.readAsDataURL(file);return}
  /* Bild verkleinern (max 1600px) und als Base64 senden */
  const img=new Image();const url=URL.createObjectURL(file);
  img.onerror=()=>{URL.revokeObjectURL(url);
   if(st)st.innerHTML='<div style="font-size:11.5px;color:var(--amber);background:var(--amber-bg);border-radius:9px;padding:9px 11px;margin-bottom:12px">Dateiformat wird auf diesem Gerät nicht unterstützt — bitte als Foto (JPG) oder PDF wählen.</div>'};
  img.onload=()=>{
   URL.revokeObjectURL(url);
   const max=1600,sc=Math.min(1,max/Math.max(img.width,img.height));
   const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
   cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);

  img.src=url})}
 inp._send=async(mediaType,b64)=>{

   const {fields:fl={}}=await r.json();

   }else{

    setV('#fz-v',fl.vin||'');

    setV('#fz-hu',(fl.hu_datum||'').slice(0,7));
    setV('#fz-kr',fl.kraftstoff||'');setV('#fz-fa',fl.farbe||'');
   }
   const got=['kennzeichen','marke','modell','vin','baujahr','hu_datum'].filter(k=>fl[k]).length;
   if(st)st.innerHTML=got?`<div style="font-size:11.5px;color:var(--green);background:var(--green-bg);border-radius:9px;padding:9px 11px;margin-bottom:12px">${got} Felder erkannt und eingetragen — bitte kurz prüfen.</div>`
    :'<div style="font-size:11.5px;color:var(--amber);background:var(--amber-bg);border-radius:9px;padding:9px 11px;margin-bottom:12px">Nichts erkannt — Foto näher, gerade und bei gutem Licht aufnehmen.</div>';
  }catch(err){

  }};
 inp.click()};

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}return t})();
const crc32=d=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=CRC_T[(c^d[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
const xEnc=s=>new TextEncoder().encode(s);
const xEsc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function makeZip(files){ /* Store-only ZIP */
 const now=new Date();
 const dosT=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF;
 const dosD=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
 let parts=[],cd=[],off=0;
 const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
 for(const f of files){
  const name=xEnc(f.name),data=f.data,crc=crc32(data);
  const lh=new Uint8Array([80,75,3,4,20,0,0,8,0,0,...u16(dosT),...u16(dosD),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),0,0]);
  parts.push(lh,name,data);
  cd.push({name,crc,size:data.length,off});
  off+=lh.length+name.length+data.length}
 const cdStart=off;let cdLen=0;
 for(const e of cd){
  const h=new Uint8Array([80,75,1,2,20,0,20,0,0,8,0,0,...u16(dosT),...u16(dosD),...u32(e.crc),...u32(e.size),...u32(e.size),...u16(e.name.length),0,0,0,0,0,0,0,0,...u32(0),...u32(e.off)]);
  parts.push(h,e.name);cdLen+=h.length+e.name.length}
 parts.push(new Uint8Array([80,75,5,6,0,0,0,0,...u16(cd.length),...u16(cd.length),...u32(cdLen),...u32(cdStart),0,0]));
 let total=0;parts.forEach(p=>total+=p.length);
 const out=new Uint8Array(total);let p=0;parts.forEach(x=>{out.set(x,p);p+=x.length});
 return out}
const colRef=i=>{let s='';i++;while(i>0){s=String.fromCharCode(65+(i-1)%26)+s;i=Math.floor((i-1)/26)}return s};
function sheetXml(rows){
 let xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
 rows.forEach((row,ri)=>{xml+='<row r="'+(ri+1)+'">';
  row.forEach((v,ci)=>{if(v===null||v===undefined||v==='')return;
   const r=colRef(ci)+(ri+1);
   if(typeof v==='number'&&isFinite(v))xml+='<c r="'+r+'"><v>'+v+'</v></c>';
   else xml+='<c r="'+r+'" t="inlineStr"><is><t xml:space="preserve">'+xEsc(v)+'</t></is></c>'});
  xml+='</row>'});
 return xml+'</sheetData></worksheet>'}
function buildXlsx(sheets){
 const files=[];
 let ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
 let wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
 let rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
 sheets.forEach((s,i)=>{
  ct+='<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
  wb+='<sheet name="'+xEsc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';
  rels+='<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
  files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:xEnc(sheetXml(s.rows))})});
 files.unshift(
  {name:'[Content_Types].xml',data:xEnc(ct+'</Types>')},
  {name:'_rels/.rels',data:xEnc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
  {name:'xl/workbook.xml',data:xEnc(wb+'</sheets></workbook>')},
  {name:'xl/_rels/workbook.xml.rels',data:xEnc(rels+'</Relationships>')});
 return makeZip(files)}

/* Einmal im Supabase-SQL-Editor ausführen. Sicherung und Statusseiten sind danach nur über den genauen Schlüssel erreichbar. Mehrfach ausführen schadet nicht. */
const SB_SQL=`create table if not exists backup (id text primary key, payload jsonb, updated_at timestamptz default now());
alter table backup enable row level security;
drop policy if exists "backup_all" on backup;
revoke all on backup from anon, authenticated;
create or replace function backup_get(p_id text) returns table(payload jsonb, updated_at timestamptz)
 language sql security definer set search_path=public as $$
 select b.payload, b.updated_at from backup b where b.id=p_id and length(p_id)>=6 $$;
create or replace function backup_put(p_id text, p_payload jsonb) returns void
 language sql security definer set search_path=public as $$

create or replace function status_put(p_backup_id text, p_id text, p_data jsonb, p_expires timestamptz) returns void
 language plpgsql security definer set search_path=public as $$
 begin
  if length(p_id)<24 or not exists(select 1 from backup where id=p_backup_id) then raise exception 'nicht erlaubt'; end if;
  delete from status_links where expires_at < now();
  insert into status_links(id,backup_id,data,expires_at,updated_at)
   values(p_id,p_backup_id,p_data,least(p_expires,now()+interval '90 days'),now())
  on conflict(id) do update set data=excluded.data, expires_at=excluded.expires_at, updated_at=now()
   where status_links.backup_id=p_backup_id;
 end $$;
create or replace function status_get(p_id text) returns jsonb
 language sql security definer set search_path=public as $$
 select s.data from status_links s where s.id=p_id and s.expires_at>now() $$;

 triageIds=S.anfragen.filter(q=>q.status==='neu')
  .sort((a,b)=>(prioOrd[a.prio]??3)-(prioOrd[b.prio]??3)||a.ts-b.ts).map(q=>q.id);
 triageIdx=0;
 if(!triageIds.length)return toast('Keine neuen Anfragen');
 triageSheet()};
function triageSheet(){

 if(triageIdx>=triageIds.length){closeSheet();render();toast('Triage abgeschlossen — alle neuen Anfragen durchgesehen');return}
 const x=anfrage(triageIds[triageIdx]);

  ${!x.grund?`<button class="btn btn-2nd" style="width:100%;margin-bottom:11px" data-act="triage-ki" data-id="${x.id}"><span class="ai-dot" style="position:relative;width:7px;height:7px"></span>&nbsp;Automatische Einschätzung (KI)</button>`:''}
  ${x.antwort?`<div class="lbl" style="margin-top:0">Antwort-Entwurf</div><div style="font-size:12px;color:var(--ink2);background:var(--blue-bg);border-radius:10px;padding:9px 11px;margin-bottom:11px;line-height:1.5">${esc(x.antwort)}</div>`:''}
  <div class="row2" style="margin-bottom:8px">
   ${x.tel?`<button class="btn btn-soft-green" data-act="triage-wa" data-id="${x.id}">WhatsApp senden</button>`:`<button class="btn btn-2nd" data-act="triage-detail" data-id="${x.id}">Details öffnen</button>`}

function vKalender(){

 const mitarb=S.mitarbeiter.filter(m=>m.aktiv);
 const act=S.auftraege.filter(a=>a.status!=='abgeholt');

 const chip=a=>{const f=fzg(a.fzgId)||{};const aw=totalAW(a);
  return `<button class="tag" style="background:${statusDot(a)}1a;color:${statusDot(a)};display:block;width:100%;margin:0 0 4px;text-align:left;font-family:inherit;cursor:pointer;border:none" data-act="open" data-v="auftrag" data-id="${a.id}">${esc(f.kennz||a.nr)}${aw>0?`<span style="opacity:.65;margin-left:4px;font-size:9px">${pct1(aw)}AW</span>`:''}</button>`};
 const totalH=mitarb.length?mitarb.length*8:8;
 const grid=`<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px">
  <div style="min-width:${90*10+72}px">
   <div style="display:grid;grid-template-columns:68px repeat(10,1fr);gap:3px;margin-bottom:6px">
    <div></div>${days.map(d=>{const load=act.filter(a=>a.abgabe===d).reduce((s,a)=>s+soldAW(a),0);
     const pct=Math.min(140,Math.round(load/totalH*100));
     const col=pct<80?'var(--green)':pct<=105?'var(--amber)':'var(--red)';
     return `<div style="text-align:center"><div style="font-size:9.5px;font-weight:700;color:${d===today?'var(--blue)':'var(--ink2)'};text-transform:uppercase;white-space:nowrap">${dLabel(d)}</div>
      <div style="height:3px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden"><i style="display:block;height:100%;width:${Math.min(100,pct)}%;background:${col}"></i></div>
      <div class="num" style="font-size:8px;color:var(--ink3)">${pct1(load)} AW</div></div>`}).join('')}
   </div>
   ${mitarb.length?mitarb.map(m=>`<div style="display:grid;grid-template-columns:68px repeat(10,1fr);gap:3px;margin-bottom:3px">

  <div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">
   <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">

ACT['datev-export']=()=>{

  /* Immer die zum Rechnungsdatum tatsächlich fakturierten Beträge nehmen — niemals mit dem AKTUELLEN MwSt-Satz neu berechnen (der kann sich seither geändert haben) */
  const netto=r.nettoCt!=null?r.nettoCt:Math.round(r.bruttoCt/(1+(S.settings.mwst||19)/100));

  rows.push([r.datum,r.nr,k?k.name:'Kunde',
   (netto/100).toFixed(2).replace('.',','),
   (mwst/100).toFixed(2).replace('.',','),
   (r.bruttoCt/100).toFixed(2).replace('.',','),
   '0,00','8400'])});
 const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='DATEV-Export-'+todayISO()+'.csv';document.body.appendChild(a);a.click();a.remove();
 toast('DATEV-Export heruntergeladen')};

function decorateKpis(){
 $$('.kpi b').forEach(b=>{
  if(b.dataset.dec)return;b.dataset.dec='1';
  if(b.querySelector('small,.u'))return;
  const t=b.textContent.trim();
  const m=t.match(/^(.+?)\s*(€|%|km|AW|h|Re\.|Std\.?|Tage)$/);
  if(m){b.textContent=m[1];const u=document.createElement('i');u.className='u';u.textContent=m[2];b.appendChild(u)}});
 $$('[data-spark]').forEach(el=>{
  if(el.dataset.done)return;el.dataset.done='1';
  const vals=el.dataset.spark.split(',').map(Number).filter(n=>!isNaN(n));
  if(vals.length<2)return;
  const w=100,h=26,mx=Math.max(...vals),mn=Math.min(...vals);
  const y=v=>mx===mn?h/2:(h-5-((v-mn)/(mx-mn))*(h-10));
  const pts=vals.map((v,i)=>[6+i*(w-12)/(vals.length-1),y(v)]);
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const last=pts[pts.length-1];
  el.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:26px;display:block">'
   +'<line x1="4" y1="'+y(avg).toFixed(1)+'" x2="'+(w-4)+'" y2="'+y(avg).toFixed(1)+'" stroke="currentColor" stroke-opacity=".2" stroke-width="1"/>'
   +pts.slice(0,-1).map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2" fill="currentColor" fill-opacity=".65"/>').join('')
   +'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="7.5" fill="var(--acc)" fill-opacity=".15"/>'
   +'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.6" fill="none" stroke="var(--acc)" stroke-width="1.5"/></svg>'});
}

/* Swipe-Geste zwischen Reitern — beide Seiten gleichzeitig sichtbar */
(()=>{
 const THRESH=0.3,DUR=260;
 function EDGE(){return Math.round(window.innerWidth*0.22)}
 let gs=null,ov=null;
 function tabs(){return NAVITEMS.map(n=>n[0])}
 function resetApp(){const a=$('#app');if(a){a.style.transition='';a.style.transform=''}}

 document.addEventListener('touchstart',e=>{
  if(e.touches.length>1)return;
  const t=e.touches[0],w=window.innerWidth,edge=EDGE();
  const side=t.clientX<edge?'L':t.clientX>w-edge?'R':null;
  if(!side)return;
  const tab=tabs(),cur=tab.indexOf(route.v);
  if(cur<0)return;
  const ti=side==='L'?cur-1:cur+1;
  if(ti<0||ti>=tab.length)return;
  gs={sx:t.clientX,sy:t.clientY,side,cur,ti,started:false,progress:0};
 },{passive:true});

 document.addEventListener('touchmove',e=>{
  if(!gs)return;
  const t=e.touches[0];
  const dx=t.clientX-gs.sx,dy=Math.abs(t.clientY-gs.sy);
  if(!gs.started){
   if(dy>Math.abs(dx)||Math.abs(dx)<8)return;
   gs.started=true;
   const w=window.innerWidth;
   ov=document.createElement('div');
   ov.style.cssText='position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden;background:var(--bg)';
   ov.innerHTML=viewHtml(tabs()[gs.ti]);
   ov.style.transform=`translateX(${gs.side==='L'?-w:w}px)`;
   document.body.appendChild(ov);
  }
  if(!gs.started||!ov)return;
  const w=window.innerWidth;
  const prog=gs.side==='L'
   ?Math.max(0,Math.min(1,(t.clientX-gs.sx)/w))
   :Math.max(0,Math.min(1,(gs.sx-t.clientX)/w));
  const dir=gs.side==='L'?-1:1;
  ov.style.transition='none';
  ov.style.transform=`translateX(${dir*(1-prog)*w}px)`;
  const a=$('#app');if(a){a.style.transition='none';a.style.transform=`translateX(${-dir*prog*w*0.25}px)`}
  gs.progress=prog;
 },{passive:true});

 function finish(){
  if(!gs){return}
  if(!gs.started){gs=null;return}
  const prog=gs.progress||0,w=window.innerWidth;
  const dir=gs.side==='L'?-1:1,tgt=tabs()[gs.ti];
  if(prog>THRESH){
   if(ov){ov.style.transition=`transform ${DUR}ms cubic-bezier(.32,1.3,.5,1)`;ov.style.transform='translateX(0)'}
   const a=$('#app');if(a){a.style.transition=`transform ${DUR}ms cubic-bezier(.32,1.3,.5,1)`;a.style.transform=`translateX(${-dir*w*0.25}px)`}
   const savedOv=ov;gs=null;
   setTimeout(()=>{
    if(savedOv&&savedOv.parentNode)savedOv.parentNode.removeChild(savedOv);
    if(ov===savedOv)ov=null;
    resetApp();skipNextSlide=true;nav(tgt);
   },DUR);
  } else {
   const savedOv=ov;ov=null;
   if(savedOv){
    savedOv.style.transition=`transform 200ms cubic-bezier(.4,0,.2,1)`;
    savedOv.style.transform=`translateX(${dir*w}px)`;
    setTimeout(()=>{if(savedOv.parentNode)savedOv.parentNode.removeChild(savedOv)},210);
   }
   const a=$('#app');if(a){
    a.style.transition='transform 200ms cubic-bezier(.4,0,.2,1)';
    a.style.transform='translateX(0)';
    setTimeout(()=>{a.style.transition='';a.style.transform=''},210);
   }
   gs=null;
  }
 }
 document.addEventListener('touchend',finish,{passive:true});
 document.addEventListener('touchcancel',finish,{passive:true});
})();
